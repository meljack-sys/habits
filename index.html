<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:#F1F5F2}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Habits, Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout concept: a phone-first shared practice log. Sticky header with person switch, five bottom tabs,
   cards on a cool green-grey ground. Emerald = completion, blue = Muhammed, orange = Tuta. */
:root{
  --bg:#F1F5F2;--surface:#FFFFFF;--surface2:#E5ECE7;--line:#D5DFD9;
  --ink:#12211B;--ink2:#41554C;--ink3:#5A6C63;
  --brand:#0B8A68;--brand-ink:#05503C;--brand-soft:#D9F1E7;
  --p1:#2C6BB4;--p1t:#235A9C;--p1s:#DCE8F6;
  --p2:#D2591F;--p2t:#B04314;--p2s:#FBE4D8;
  --z1:#D8664F;--z2:#E2A63B;--z3:#2DAA80;
  --shadow:0 1px 2px rgba(18,33,27,.06),0 10px 28px rgba(18,33,27,.07);
  --f-d:'Sora','Segoe UI',system-ui,sans-serif;--f-b:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1411;--surface:#121F1A;--surface2:#1B2B24;--line:#243A31;
    --ink:#E8F1ED;--ink2:#B2C4BB;--ink3:#93A89E;
    --brand:#35C79B;--brand-ink:#9BE8CE;--brand-soft:#123629;
    --p1:#5C8FD8;--p1t:#8DB4EE;--p1s:#1B2D45;
    --p2:#D96A30;--p2t:#F0955F;--p2s:#47291A;
    --z1:#E5806B;--z2:#EBB656;--z3:#3CC596;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1411;--surface:#121F1A;--surface2:#1B2B24;--line:#243A31;
  --ink:#E8F1ED;--ink2:#B2C4BB;--ink3:#93A89E;
  --brand:#35C79B;--brand-ink:#9BE8CE;--brand-soft:#123629;
  --p1:#5C8FD8;--p1t:#8DB4EE;--p1s:#1B2D45;
  --p2:#D96A30;--p2t:#F0955F;--p2s:#47291A;
  --z1:#E5806B;--z2:#EBB656;--z3:#3CC596;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.wrap{max-width:1040px;margin-inline:auto;min-width:0}
.ic{width:20px;height:20px;flex:none}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:20px;letter-spacing:-.01em}
h3{font-size:15px}
p{margin:0}
small,.muted{color:var(--ink3)}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand b{font-family:var(--f-d);font-size:17px;letter-spacing:-.02em}
.brand small{display:block;font-size:12px;margin-top:1px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.chip.ok i{background:var(--z3)}.chip.warn i{background:var(--z2)}
.seg{display:flex;gap:4px;background:var(--surface2);border-radius:14px;padding:4px;margin-top:10px}
.seg button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

main{padding-block:14px 120px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0}
.card.hero{box-shadow:var(--shadow);background:linear-gradient(180deg,var(--brand-soft) 0,var(--surface) 62%)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h .sub{font-size:13px;color:var(--ink3)}
.grid{display:grid;gap:14px;min-width:0}
@media (min-width:860px){.grid.two{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.banner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--ink3);border-radius:16px;padding:14px 16px}
.banner p{flex:1 1 240px;font-size:14px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;font-weight:700;border-radius:12px;padding:11px 18px}
.btn.alt{background:var(--surface2);color:var(--ink)}
.btn.danger{background:#B83A2E;color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.datenav h2{text-align:center;flex:1;min-width:0}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.iconbtn[disabled]{opacity:.35;cursor:not-allowed}

/* person block header */
.ph{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ph h3{font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere}
.ph small{display:block;font-size:13px;font-weight:500;margin-top:2px}
.ringwrap{position:relative;width:56px;height:56px;flex:none}
.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-d);font-size:14px;font-variant-numeric:tabular-nums}
.done-banner{display:flex;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand-ink);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;margin-bottom:10px}

/* habit rows */
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 12px;border-radius:16px;background:var(--bg);border:1px solid transparent;min-height:64px}
.row:hover{border-color:var(--line)}
.row .nm{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.row .meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:12.5px;color:var(--ink3)}
.row .wk{font-family:var(--f-d);font-size:13px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.on .nm{color:var(--ink2)}
.chk{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink3);display:grid;place-items:center;color:transparent;background:transparent;transition:background .18s,border-color .18s,transform .18s}
.chk svg{width:24px;height:24px}
.chk path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .28s .05s}
.on .chk{background:var(--brand);border-color:var(--brand);color:#fff}
.on .chk path{stroke-dashoffset:0}
.chk.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.tag{display:inline-flex;align-items:center;gap:4px}
.tag .ic{width:13px;height:13px}

/* week grid */
.wdays,.wcells,.wbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wdays .hd{font-size:11.5px;font-weight:700;color:var(--ink3);text-align:center;text-transform:uppercase;letter-spacing:.04em;line-height:1.3}
.wdays .hd.today{color:var(--brand)}
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:16px 0 6px}
.wh .hn{font-size:14px;font-weight:600;line-height:1.25;overflow-wrap:anywhere;min-width:0}
.wh .tot{font-family:var(--f-d);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap;padding:2px 8px;border-radius:99px;background:var(--surface2)}
.wh .tot.met{color:var(--brand-ink);background:var(--brand-soft)}
.cell{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-inline:auto;color:transparent;background:transparent}
.cell svg{width:19px;height:19px}
.cell.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cell.today{border-color:var(--ink3)}
.cell.on.today{border-color:var(--brand)}
.cell[disabled]{opacity:.35;cursor:default}
.wbars{align-items:end;height:48px;margin-top:18px;padding-top:6px;border-top:1px solid var(--line)}
.wbars span{display:block;width:14px;border-radius:4px 4px 0 0;margin-inline:auto;min-height:3px}
.wcap{font-size:12px;color:var(--ink3);margin-top:6px}

/* gauge + stats */
.gauge{width:100%;max-width:300px;margin-inline:auto;display:block;overflow:visible}
.needle{transition:transform 1s cubic-bezier(.2,.9,.25,1)}
.gz{text-align:center}
.gz .lab{font-weight:700;font-size:14px;margin-top:-4px}
.gz .zone{font-size:12.5px;color:var(--ink3);margin-top:2px}
.herogrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--bg);border-radius:14px;padding:10px 8px;text-align:center;min-width:0}
.stat b{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--f-d);font-size:22px;font-variant-numeric:tabular-nums}
.stat b .ic{width:18px;height:18px;color:var(--z2)}
.stat span{display:block;font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.25}
.together{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.together .bar{flex:1;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.together .bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.together b{font-family:var(--f-d);font-size:18px;min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}

/* deltas */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.delta{background:var(--bg);border-radius:16px;padding:12px 14px;min-width:0}
.delta small{display:block;font-size:12.5px;line-height:1.3}
.delta b{display:flex;align-items:center;gap:6px;font-family:var(--f-d);font-size:24px;margin-top:6px;font-variant-numeric:tabular-nums}
.delta b .ic{width:20px;height:20px}
.delta .from{font-size:12px;color:var(--ink3);margin-top:3px}
.delta.up b{color:var(--brand-ink)}.delta.down b{color:#B83A2E}
:root[data-theme="dark"] .delta.down b{color:#F09A8B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .delta.down b{color:#F09A8B}}
.pname{display:flex;align-items:center;gap:8px;font-weight:700;margin:2px 0 10px}

/* charts */
.chartbox{position:relative;min-width:0}
.chartbox svg{width:100%;height:auto;display:block;touch-action:pan-y}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:4px;border-radius:2px;display:inline-block}
.axis{font-size:11px;fill:var(--ink3);font-family:var(--f-b)}
.pill-seg{display:inline-flex;background:var(--surface2);border-radius:99px;padding:3px}
.pill-seg button{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--ink2)}
.pill-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}

/* heatmap */
.heat{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;max-width:520px}
.heat .wl{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--ink3);text-align:right;align-items:center}
.heat .cells{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.hc{aspect-ratio:1;min-height:12px;border-radius:5px;background:var(--surface2)}
.hc.fut{background:transparent;border:1px dashed var(--line)}
.hc.td{outline:2px solid var(--ink);outline-offset:1px}
.heatkey{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3);margin-top:10px}
.heatkey i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* balance + habit bars */
.balance{display:grid;gap:18px;align-items:center;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.arows{display:grid;gap:12px}
.arow{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.arow .ic{color:var(--ink2);margin-top:2px}
.arow .t{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.arow .t em{font-style:normal;font-weight:600;font-size:12.5px;color:var(--ink3)}
.hb{position:relative;height:20px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:5px}
.hb i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.hb b{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;font-size:11.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.hb.thin{height:10px}
.hrow{display:grid;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0;padding-top:0}
.hrow .hn2{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.hrow .hn2 small{font-weight:500;margin-left:8px}

/* impact */
.areahead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.areaico{width:42px;height:42px;border-radius:13px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.areahead h2{flex:1;min-width:0}
.mtable{display:grid;gap:0;font-size:14px}
.mrow{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(var(--n,1),minmax(0,1fr));gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.mrow:first-child{border-top:0}
.mrow.h{font-size:12.5px;font-weight:700;color:var(--ink3)}
.mrow .v{font-family:var(--f-d);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mrow .v small{font-family:var(--f-b);font-weight:500;font-size:12px;margin-left:4px}
.mrow .l small{display:block;font-size:12px;line-height:1.3;margin-top:2px}
.evi{background:var(--bg);border-radius:16px;padding:14px 16px;margin-top:14px;display:grid;gap:8px}
.evi .k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.evi .k .badge{background:var(--surface2);color:var(--ink2);border-radius:99px;padding:3px 9px;letter-spacing:0;text-transform:none;font-size:12px}
.evi p{font-size:14px;color:var(--ink2)}
.evi .src{font-size:12.5px;color:var(--ink3)}
.note{font-size:12.5px;color:var(--ink3)}
.disc{font-size:13px;color:var(--ink3);line-height:1.5}
.quote{text-align:center;padding:10px 6px 0;color:var(--ink2);font-size:14px}
.quote small{display:block;margin-top:4px}
.hs{display:grid;gap:12px}
.hs .hn2{font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.hs .hn2 small{font-weight:500}

/* setup */
.form{display:grid;gap:12px}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2);min-width:0}
.in{width:100%;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.in:focus{border-color:var(--brand);outline:none}
textarea.in{min-height:70px;resize:vertical}
.focus{display:flex;flex-wrap:wrap;gap:8px}
.focus label{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.focus input{accent-color:var(--brand)}
.hset{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.hset.off{opacity:.55}
.hset .top2{display:flex;align-items:center;gap:10px;font-weight:700}
.hset .top2 input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none}
.hset .top2 .in{flex:1}
.hset .fgrid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.sticky-save{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:14px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 68%,transparent);z-index:40;pointer-events:none}
.tabs nav{pointer-events:auto;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow);width:100%;max-width:520px}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:16px;font-size:11.5px;font-weight:700;color:var(--ink3)}
.tabs button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink)}

#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.35;padding:7px 10px;border-radius:10px;max-width:240px;opacity:0;transition:opacity .12s}
#tip.show{opacity:1}
#tip b{font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:70;max-width:min(92vw,420px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* daily thought */
.daily{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.daily .dk{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brand-ink)}
.daily .dq{font-size:16px;line-height:1.5;margin-top:6px;font-weight:600}
.daily .da{font-size:12.5px;color:var(--ink3);margin-top:6px}
.daily details{margin-top:8px}
.daily summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--brand-ink);min-height:32px;display:flex;align-items:center}
.daily .ds{font-size:14.5px;line-height:1.6;margin-top:6px;color:var(--ink2)}
/* groups, steppers, status */
.agroup{display:grid;gap:8px;margin-top:6px}
.agh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:14px 0 4px}
.agh .ic{width:15px;height:15px}
.agroup2{margin-top:18px}.agroup2:first-of-type{margin-top:0}
.stepper{display:flex;gap:8px}
.cntrow,.caprow{cursor:default}
.glasses{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.gl{width:14px;height:20px;border-radius:3px 3px 6px 6px;border:2px solid var(--ink3);display:inline-block;background:transparent}
.gl.f{background:var(--brand);border-color:var(--brand)}
.st{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12.5px;padding:2px 8px;border-radius:99px}
.st .ic{width:13px;height:13px}
.st.ok{background:var(--brand-soft);color:var(--brand-ink)}
.st.bad{background:#FBE3DF;color:#8F2A20}
:root[data-theme="dark"] .st.bad{background:#4A2420;color:#F6B3A8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st.bad{background:#4A2420;color:#F6B3A8}}
.caprow.ok .capchk{background:var(--brand);border-color:var(--brand);color:#fff}
.caprow.over .capchk{background:#B83A2E;border-color:#B83A2E;color:#fff}
.capline{margin:6px 0}
.cell.numc .cn{font-size:13px;font-weight:700;color:var(--ink);line-height:1}
.cell.numc.on .cn{color:#fff}
/* entry sheet */
#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-card{position:relative;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;box-shadow:var(--shadow);max-height:85vh;overflow:auto}
.sheet-card h3{font-size:18px;margin-bottom:6px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1.5px solid var(--line);border-radius:99px;padding:9px 14px;font-weight:600;font-size:14px;min-height:44px}
.chipbtn.sel{background:var(--brand);border-color:var(--brand);color:#fff}
/* advice + trophies */
.advice{display:grid;gap:10px;margin-top:14px}
.adv{background:var(--bg);border-radius:16px;padding:12px 14px}
.adv h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.adv p{font-size:14.5px;line-height:1.55;color:var(--ink2)}
.advice .src{font-size:12.5px;color:var(--ink3)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.trophy{display:grid;gap:3px;justify-items:center;text-align:center;padding:12px 6px;border-radius:16px;background:var(--bg);opacity:.6;border:1px dashed var(--line)}
.trophy.got{opacity:1;background:var(--brand-soft);border:1px solid var(--brand)}
.tico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--ink3)}
.trophy.got .tico{background:var(--brand);color:#fff}
.tico .ic{width:22px;height:22px}
.tt{font-weight:700;font-size:12.5px;line-height:1.25}
.tp{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
#lang{cursor:pointer;font-weight:700}
/* daily banner extras */
.daily .dcat{display:inline-block;margin-inline-start:8px;padding:1px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand-ink);font-size:11px;letter-spacing:.03em}
.daily .dorig{font-size:19px;line-height:1.9;margin-top:6px;font-weight:600}
/* coach */
.coach-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.coach-h h2{font-size:20px}
.coach-h small{color:var(--ink3);font-size:13px}
.coach .dot{width:14px;height:14px;flex:none}
.cs{margin-top:14px}
.cs h3{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.cs ul{list-style:none;display:grid;gap:8px;padding:0}
.cs li{font-size:15px;line-height:1.55;color:var(--ink);padding-inline-start:16px;position:relative}
.cs li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.cs li.tipli{padding-inline-start:16px}
.cs li.tipli::before{display:none}
.ctip{background:var(--bg);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.5;color:var(--ink2)}
.cbook{display:inline-block;font-size:11.5px;color:var(--ink3);font-style:italic;margin-inline-start:4px}
.cthanks{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;line-height:1.55;font-size:15px}
/* trophy levels */
.trophy{opacity:1;position:relative}
.trophy:not(.got){opacity:.75}
.trophy .tl{font-size:11.5px;font-weight:700;color:var(--ink3)}
.pips{display:flex;gap:3px;justify-content:center;margin-top:2px}
.pip{width:6px;height:6px;border-radius:50%;background:var(--line);display:inline-block}
.pip.on{background:var(--brand)}
.tbar{display:block;width:78%;height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.tbar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.trophy.tr1 .tico{background:#B07A4A;color:#fff}
.trophy.tr2 .tico{background:#8F9AA6;color:#fff}
.trophy.tr3 .tico{background:#D4A017;color:#fff}
.trophy.tr4 .tico{background:#5C9DAF;color:#fff}
.trophy.tr5 .tico{background:#3F8FE0;color:#fff}
.trophy.tr6 .tico{background:#8B54D6;color:#fff}
.trophy.got{border-color:var(--line);background:var(--surface2)}
/* right-to-left (Arabic) */
html[dir="rtl"]{--f-d:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;--f-b:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{letter-spacing:0;text-transform:none}
html[dir="rtl"] .agh,html[dir="rtl"] .cs h3,html[dir="rtl"] .adv h3,html[dir="rtl"] .dk{letter-spacing:0;text-transform:none}
html[dir="rtl"] [data-act="day"] svg,html[dir="rtl"] [data-act="week"] svg{transform:scaleX(-1)}
html[dir="rtl"] svg[role="img"]{direction:ltr}
html[dir="rtl"] .heat .wl{text-align:left}
html[dir="rtl"] .mrow .v,html[dir="rtl"] .stat b{direction:ltr;unicode-bidi:isolate}
html[dir="rtl"] .tabs nav{direction:rtl}
html[dir="rtl"] #toast{direction:rtl}
.daily .drel{font-size:20px;line-height:2;font-weight:600}
.daily .dtr{font-size:13.5px;line-height:1.5;color:var(--ink2);margin-top:4px}


/* === Approved royal-violet design system (presentation only) === */
:root{
  --bg:#F4EEFB;--surface:#FFFFFF;--surface2:#EFE3F9;--line:#DECBEA;
  --ink:#261536;--ink2:#463252;--ink3:#654F72;
  --brand:#7635BD;--brand-ink:#69319E;--brand-soft:#F1E5FA;
  --p1:#276FD5;--p1t:#1E579F;--p1s:#E4F0FF;
  --p2:#C8327A;--p2t:#A72461;--p2s:#FFE8F2;
  --z1:#DC6D52;--z2:#B97918;--z3:#09875F;
  --shadow:0 3px 8px rgba(43,17,75,.045),0 14px 35px rgba(51,22,86,.085);
  --f-d:'Sora','Segoe UI',system-ui,sans-serif;--f-b:'Figtree','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#20142F;--surface:#342344;--surface2:#442E58;--line:#765B8B;
  --ink:#F9F2FF;--ink2:#F0E4FA;--ink3:#DFCEEC;
  --brand:#7A38B9;--brand-ink:#EDCDFF;--brand-soft:#492D61;
  --p1:#72BDFF;--p1t:#BEDFFF;--p1s:#283954;
  --p2:#FF81BB;--p2t:#FFD0E6;--p2s:#48273E;
  --z1:#FFAA93;--z2:#FFD082;--z3:#87EABD;
  --shadow:0 8px 22px rgba(0,0,0,.18);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#20142F;--surface:#342344;--surface2:#442E58;--line:#765B8B;
  --ink:#F9F2FF;--ink2:#F0E4FA;--ink3:#DFCEEC;
  --brand:#7A38B9;--brand-ink:#EDCDFF;--brand-soft:#492D61;
  --p1:#72BDFF;--p1t:#BEDFFF;--p1s:#283954;
  --p2:#FF81BB;--p2t:#FFD0E6;--p2s:#48273E;
  --z1:#FFAA93;--z2:#FFD082;--z3:#87EABD;
  --shadow:0 8px 22px rgba(0,0,0,.18);color-scheme:dark;
}
*{min-width:0}
html{scroll-padding-top:170px}
body{background:var(--bg);color:var(--ink);background-image:radial-gradient(ellipse at 100% 0,rgba(142,77,203,.075),transparent 37%),radial-gradient(ellipse at 0 90%,rgba(68,140,224,.065),transparent 30%);padding-inline:16px;font-size:15px;line-height:1.5}
button,input,select,textarea{accent-color:var(--brand)}
:focus-visible{outline:3px solid #A76EEC;outline-offset:3px}
h1,h2,h3{color:var(--ink)}h2{font-size:20px;line-height:1.32}h3{line-height:1.38}
small,.muted,.note{color:var(--ink3)}
.ic{width:21px;height:21px}
/* Cairo-local daily hybrid scene. Fallback is painted under any remote photo. */
.top{position:sticky;isolation:isolate;top:env(safe-area-inset-top,0px);z-index:30;padding:17px 16px 13px;overflow:hidden;background:#311447;color:#fff;border-radius:0 0 21px 21px;box-shadow:0 10px 24px rgba(24,12,43,.16);min-height:116px}
.top:before,.top:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:-2;background-repeat:no-repeat;background-position:center;background-size:cover}
.top:before{background-image:linear-gradient(97deg,rgba(34,16,57,.94),rgba(44,18,69,.66) 58%,rgba(21,13,41,.79)),var(--scene-photo),linear-gradient(135deg,#49285E,#AB578C 65%,#F39F7C);background-color:#49285E}
.top:after{background-image:var(--scene-art);background-position:right bottom;background-size:cover;z-index:-1;opacity:.46}
.top-row{gap:8px;align-items:center;flex-wrap:wrap}
.brand{gap:10px}.mark{width:44px;height:44px;border-radius:13px;background:transparent;box-shadow:0 5px 14px #17072880}.mark svg{height:44px;width:44px}
.brand b{font-family:var(--f-d);font-size:16px;letter-spacing:-.04em;color:#FFF5FF}.brand small{color:#F3DFFF;font-size:10.5px}
.top-row>span{gap:5px!important;max-width:100%;margin-inline-start:auto}
.top #status,.top #lang{color:#FFFFFF;background:rgba(30,15,48,.8);border:1px solid rgba(236,208,255,.6);font-size:11px;font-weight:750;min-height:39px;padding:8px 10px;backdrop-filter:blur(9px)}
.top #status{border-radius:11px;white-space:normal;line-height:1.25}
.top #status:before{content:"i";display:grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:11px;font-weight:900;flex:none;border:1.5px solid currentColor}
.top #status.ok{background:rgba(24,81,58,.93);border-color:#75E2B7;color:#E1FFEF}
.top #status.ok:before{content:"✓"}.top #status.warn{background:rgba(90,57,30,.95);border-color:#F4C58E;color:#FFF2D7}
.top #status.warn:before{content:"!"}.top #status i{display:none}
.top #lang{border-radius:10px;min-width:47px;justify-content:center}
.seg{background:rgba(24,12,46,.74);border:1px solid #D0A7ED70;border-radius:13px;margin-top:15px;padding:4px;gap:3px;backdrop-filter:blur(9px)}
.seg button{font-size:12.5px;color:#F5E3FF;min-height:44px;gap:6px;border-radius:10px;padding:9px 6px}
.seg button[aria-pressed="true"]{background:#7741BD;color:#FFFFFF;box-shadow:inset 0 1px 1px #FFFC,0 2px 7px #1B0C3D4A}
main{padding-top:15px;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.hero{background:radial-gradient(ellipse at 2% 0,var(--brand-soft),var(--surface) 68%)}
.grid,.grid.two{gap:13px}
.card-h{gap:8px;align-items:flex-start}.card-h h2{font-size:19px}.card-h .sub{color:var(--ink3);font-size:12px;line-height:1.4}
.btn{min-height:44px;background:#7334B9;color:#fff;border-radius:11px;font-size:13px;box-shadow:0 4px 9px rgba(77,29,123,.17)}
.btn.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:#AE302D;color:#fff}
.banner{border:1px solid #BA8BDF;border-inline-start:5px solid #8F4DD3;background:linear-gradient(125deg,var(--brand-soft),var(--surface));box-shadow:var(--shadow);border-radius:15px;gap:12px;padding:15px}
.banner p{color:var(--ink);line-height:1.55}.banner b{color:var(--ink)}
.datenav{gap:7px}.datenav h2{font-size:19px;color:var(--ink)}.datenav small{font-size:11px}
.iconbtn{height:44px;width:44px;min-width:44px;flex:none;border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:0 2px 4px rgba(45,14,64,.05)}
.iconbtn[disabled]{opacity:.38}
.ph{gap:10px;align-items:center}.ph h3{font-size:17px}.ph small{color:var(--ink3)}
.ringwrap{width:58px;height:58px}
.done-banner{background:#E0F8EC;color:#075C40;border:1px solid #97DDBB;border-radius:11px;font-weight:750}
/* Jewel Duotone: each distinct life area, no changes to source SVG function. */
.area-faith{--cat:#8C45D2;--cat2:#C995FF;--tint:#F1E4FF}
.area-body{--cat:#DA6B1C;--cat2:#FFB264;--tint:#FFF0DF}
.area-mind{--cat:#087F99;--cat2:#66DCE8;--tint:#E1F7FA}
.area-family{--cat:#A6770D;--cat2:#FFD17A;--tint:#FFF3D9}
.area-money{--cat:#16834A;--cat2:#7FE4A9;--tint:#E4F6E9}
.area-heart{--cat:#CC3B6B;--cat2:#FFA1C0;--tint:#FDEAF1}
.agh{font-size:12px;letter-spacing:.025em;color:var(--cat,var(--brand-ink));font-weight:850;line-height:1.45;margin:12px 0 5px}
.agh .ic{height:25px;width:25px;padding:4px;border-radius:8px;color:#FFF;background:linear-gradient(135deg,var(--cat2,#B88AEE),var(--cat,#7F39C5))}
.agroup{border-inline-start:3px solid var(--cat,var(--brand));padding-inline-start:9px;margin-top:13px;gap:8px}
.agroup .agh{margin:0 0 3px}
.row{grid-template-columns:44px minmax(0,1fr) auto;gap:9px;min-height:70px;border:1px solid color-mix(in srgb,var(--cat,#8D4CCF) 30%,var(--line));border-inline-start:3px solid var(--cat,var(--brand));border-radius:13px;background:linear-gradient(115deg,var(--tint,var(--surface2)),var(--surface) 65%);padding:11px 10px}
.row .nm{color:var(--ink);font-size:14px;font-weight:800;line-height:1.42}
.row.on .nm{color:var(--ink)}
.row .meta{font-size:11.5px;color:var(--ink2);margin-top:4px;gap:4px 7px;line-height:1.4}
.row .tag{color:var(--cat,var(--ink2));font-weight:800}
.row .wk{font-size:12px;font-weight:850;color:var(--ink);white-space:normal;text-align:end}
.row .wk small{font-size:10px}
.chk{height:44px;width:44px;min-width:44px;border-color:var(--cat,#9B5DCA);border-width:2.5px;color:transparent;background:var(--surface)}
.on .chk{background:#078E67;border-color:#078E67;color:#fff}
.row:not(.on) .chk svg{opacity:.3}
.cntrow .chk,.caprow .chk{pointer-events:none}
.caprow.ok .capchk{color:#FFFFFF;background:#078E67;border-color:#078E67}
.caprow.over .capchk{color:#FFFFFF;background:#AD3834;border-color:#AD3834}
.stepper{gap:5px}.stepper .iconbtn{width:44px;height:44px}
.st{font-size:11px;font-weight:800;line-height:1.4;padding:4px 8px;white-space:normal}
.st.ok{background:#D9F4E8;color:#075C41;border:1px solid #9DD8BA}
.st.bad{background:#FEE1DB;color:#932F24;border:1px solid #EAB0A5}
.gl{border-color:var(--cat,#8B55C8)}.gl.f{background:#0E9D73;border-color:#0E9D73}
/* The selected Week page: jewel cards, exactly seven circular buttons. */
.wdays,.wcells{grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wdays{margin:5px 7px 9px}.wdays .hd{font-size:11px;color:var(--ink2);letter-spacing:0;line-height:1.5}
.wdays .hd.today{color:var(--brand-ink);font-weight:900;text-decoration:underline;text-underline-offset:3px}
.week-jewel{border:1px solid color-mix(in srgb,var(--cat) 44%,var(--line));border-inline-start:4px solid var(--cat);border-radius:13px;padding:11px 7px;background:linear-gradient(115deg,var(--tint),var(--surface) 71%);margin-top:9px}
.week-jewel .wh{margin:0 0 10px;align-items:center;flex-wrap:wrap;gap:5px 8px}
.week-jewel .hn{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px;line-height:1.4;font-weight:850;flex:1 1 155px}
.week-jicon{flex:none;height:32px;width:32px;border-radius:10px;background:linear-gradient(140deg,var(--cat2),var(--cat));display:grid;place-items:center;color:#fff}
.week-jicon .ic{height:21px;width:21px}
.wh .tot{background:var(--surface);color:var(--ink2);border:1px solid var(--line);font-size:11px;font-weight:850;padding:4px 8px}
.wh .tot.met{background:#DBF5E7;color:#07613F;border-color:#95D8B8}
.cell{position:relative;border-radius:50%;height:44px;width:44px;max-width:100%;aspect-ratio:1;border:2px solid color-mix(in srgb,var(--cat) 48%,var(--line));background:var(--surface);color:transparent;touch-action:manipulation}
.cell:focus-visible{outline-offset:2px}
.cell.on{background:#098D68;border-color:#098D68;color:#fff}
.cell.today:not(.on){border:3px solid var(--cat)}.cell.on.today{border:3px solid #078D67;box-shadow:0 0 0 2px var(--cat)}
.cell[disabled]{opacity:.38;border-style:dashed}.cell .cn{color:var(--ink);font-size:13px;font-weight:850}
.cell.numc.on .cn{color:#fff}
/* Dashboard: real, computed 12-week values; existing other charts kept intact. */
.weekly-strip{--best:#D3A252;padding:2px 0 0}.weekly-strip .chartbox{min-width:0}
.weekly-strip svg{height:auto;width:100%;overflow:visible;max-height:260px}
.weekly-strip .axis{font-size:11px}
.dgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.delta{border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:11px 9px}
.delta b{font-size:19px;flex-wrap:wrap}.delta small{font-size:11px}.delta .from{color:var(--ink3)}
