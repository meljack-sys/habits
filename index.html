tions 5.20"}, {"id": "t23", "c": "life", "en": "It is not that we have a short time to live, but that we waste much of it.", "ar": "ليست المشكلة أن عمرنا قصير، بل أننا نضيّع جزءًا كبيرًا منه.", "by": "Seneca · On the Shortness of Life"}, {"id": "t24", "c": "life", "en": "A journey of a thousand miles begins with a single step.", "ar": "رحلة الألف ميل تبدأ بخطوة واحدة.", "by": "Lao Tzu · Tao Te Ching, ch. 64"}, {"id": "t25", "c": "life", "en": "Genius is one percent inspiration and ninety-nine percent perspiration.", "ar": "العبقرية واحد في المئة إلهام وتسعة وتسعون في المئة عرق.", "by": "Thomas Edison"}, {"id": "t26", "c": "life", "en": "Do the best you can until you know better. Then when you know better, do better.", "ar": "افعل أفضل ما تقدر عليه حتى تعرف أفضل، وحين تعرف أفضل افعل أفضل.", "by": "Maya Angelou"}, {"id": "t27", "c": "life", "en": "Well done is better than well said.", "ar": "العمل الجيد أفضل من الكلام الجيد.", "by": "Benjamin Franklin · Poor Richard’s Almanack"}, {"id": "t28", "c": "life", "en": "Nothing great was ever achieved without enthusiasm.", "ar": "لا يتحقق شيء عظيم بدون حماس.", "by": "Ralph Waldo Emerson · Circles"}, {"id": "t29", "c": "life", "en": "Nothing will ever be attempted if all possible objections must first be overcome.", "ar": "لن يُجرَّب شيء أبدًا إذا انتظرنا زوال كل الاعتراضات أولًا.", "by": "Samuel Johnson · Rasselas"}, {"id": "t30", "c": "life", "en": "The credit belongs to the person who is actually in the arena, whose face is marred by dust and sweat and blood.", "ar": "الفضل لمن هو فعلًا في الساحة، ووجهه ملطّخ بالغبار والعرق والدم.", "by": "Theodore Roosevelt · Citizenship in a Republic, 1910"}, {"id": "t31", "c": "money", "en": "Do not save what is left after spending. Spend what is left after saving.", "ar": "لا تدّخر ما يتبقى بعد الإنفاق، بل أنفق ما يتبقى بعد الادخار.", "by": "Warren Buffett"}, {"id": "t32", "c": "money", "en": "Beware of little expenses. A small leak will sink a great ship.", "ar": "احذر من المصاريف الصغيرة، فثقب صغير يغرق سفينة كبيرة.", "by": "Benjamin Franklin · Poor Richard’s Almanack"}, {"id": "t33", "c": "business", "en": "Make something people want.", "ar": "اصنع شيئًا يريده الناس.", "by": "Y Combinator’s motto, Paul Graham"}, {"id": "t34", "c": "business", "en": "Get out of the building. The facts are outside, with real customers.", "ar": "اخرج من المكتب. الحقائق في الخارج عند الزبائن الحقيقيين.", "by": "Steve Blank · customer development"}, {"id": "t35", "c": "business", "en": "If you are not embarrassed by the first version of your product, you launched too late.", "ar": "إن لم تخجل من النسخة الأولى من منتجك، فقد أطلقته متأخرًا.", "by": "Reid Hoffman"}, {"id": "t36", "c": "life", "en": "Pain plus reflection equals progress.", "ar": "الألم زائد التأمّل يساوي تقدّمًا.", "by": "Ray Dalio · Principles"}, {"id": "t37", "c": "life", "en": "When we are no longer able to change a situation, we are challenged to change ourselves.", "ar": "حين لا نعود قادرين على تغيير الموقف، يصبح التحدّي أن نغيّر أنفسنا.", "by": "Viktor Frankl · Man’s Search for Meaning (idea)"}, {"id": "t38", "c": "life", "en": "Discipline is the bridge between goals and accomplishment.", "ar": "الانضباط هو الجسر بين الأهداف والإنجاز.", "by": "Jim Rohn"}, {"id": "t40", "c": "faith", "en": "Be in this world as if you were a stranger or a traveller.", "ar": "كن في الدنيا كأنك غريب أو عابر سبيل.", "by": "The Prophet ﷺ · Sahih al-Bukhari 6416", "orig": "كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ"}, {"id": "t41", "c": "faith", "en": "Take account of yourselves before you are taken to account.", "ar": "حاسبوا أنفسكم قبل أن تحاسبوا.", "by": "Attributed to Umar ibn al-Khattab, quoted by at-Tirmidhi"}, {"id": "t42", "c": "heart", "en": "In the remembrance of Allah do hearts find rest.", "ar": "ألا بذكر الله تطمئن القلوب.", "by": "Qur’an 13:28", "orig": "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ"}, {"id": "t43", "c": "faith", "en": "Your Lord has not abandoned you, nor is He displeased. And the end will be better for you than the beginning.", "ar": "ما ودّعك ربك وما قلى. وللآخرة خير لك من الأولى.", "by": "Qur’an 93:3-4", "orig": "مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ ۝ وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ"}, {"id": "t45", "c": "life", "en": "Start where you are. Use what you have. Do what you can.", "ar": "ابدأ من حيث أنت. استخدم ما معك. افعل ما تستطيع.", "by": "Attributed to Arthur Ashe"}], "week": [{"id": "w01", "c": "faith", "en": "Two Qur’an pages a day finish the whole Madinah mushaf (604 pages) in 302 days. In one year you can complete it and begin again.", "ar": "صفحتان من القرآن كل يوم تختمان المصحف المدني (604 صفحات) في 302 يومًا. في سنة واحدة تختم وتبدأ من جديد.", "by": "Simple arithmetic on the standard Madinah mushaf"}, {"id": "w02", "c": "science", "en": "In a study of habit formation, missing a single day did not meaningfully harm the process. What mattered was getting back to it.", "ar": "في دراسة عن تكوين العادات، فوات يوم واحد لم يضر بالعملية. المهم هو أنك ترجع في اليوم التالي.", "by": "Lally et al., European Journal of Social Psychology, 2010", "moreEn": "In that study of 96 volunteers, the time for a daily behaviour to feel automatic ranged from 18 to 254 days, with a median of 66 days. It is a range, not a deadline.", "moreAr": "في هذه الدراسة على 96 متطوعًا، تراوح الوقت لتصبح العادة تلقائية بين 18 و254 يومًا، والوسيط 66 يومًا. هذا مدى وليس موعدًا نهائيًا."}, {"id": "w03", "c": "science", "en": "People who decide in advance exactly when and where they will act (“If it is 8 pm, then I read”) follow through noticeably more often.", "ar": "الناس الذين يقررون مسبقًا متى وأين سيفعلون (إذا جاءت الساعة 8 مساءً، فسأقرأ) ينفّذون أكثر بشكل ملحوظ.", "by": "Gollwitzer and Sheeran, Advances in Experimental Social Psychology, 2006 (94 studies)", "moreEn": "The analysis of 94 studies found a medium-to-large effect of these “if-then” plans on reaching goals.", "moreAr": "وجد التحليل لـ94 دراسة تأثيرًا متوسطًا إلى كبيرًا لخطط (إذا… فإن…) على تحقيق الأهداف."}, {"id": "w04", "c": "science", "en": "Around 43% of the things people did every day happened in the same place and the same context. Habits live in surroundings, not only in willpower.", "ar": "حوالي 43% من الأشياء التي يفعلها الناس يوميًا حدثت في نفس المكان والسياق. العادات تعيش في البيئة وليس في قوة الإرادة فقط.", "by": "Wood, Quinn and Kashy, Journal of Personality and Social Psychology, 2002", "moreEn": "Change the place and the cue and the habit changes with it. That is why a fixed spot for your Qur’an or your shoes by the door works better than good intentions.", "moreAr": "غيّر المكان والإشارة تتغير العادة. ولهذا فإن مكانًا ثابتًا للمصحف أو للحذاء عند الباب أنفع من النوايا الطيبة."}, {"id": "w05", "c": "science", "en": "Writing your goals down, sharing them with a friend and sending a weekly update was linked with the highest achievement in a small study of 267 people.", "ar": "كتابة أهدافك ومشاركتها مع صديق وإرسال تقرير أسبوعي كانت مرتبطة بأعلى إنجاز في دراسة صغيرة على 267 شخصًا.", "by": "Dr Gail Matthews, Dominican University of California, 2015", "moreEn": "It was a small study, so treat it as encouragement, not proof. You two are already doing the sharing part.", "moreAr": "دراسة صغيرة، فاعتبرها تشجيعًا وليس دليلًا قاطعًا. وأنتما فعلًا تشاركان بعضكما التقدّم."}, {"id": "w06", "c": "health", "en": "Large studies link meeting the activity guideline (150 minutes a week) with a clearly lower risk of dying early compared with being inactive.", "ar": "الدراسات الكبيرة تربط الوصول لتوصية النشاط (150 دقيقة في الأسبوع) بخطر أقل بوضوح للوفاة المبكرة مقارنة بعدم النشاط.", "by": "WHO guidelines on physical activity, 2020 · Arem et al., JAMA Internal Medicine, 2015", "moreEn": "Five 30-minute workouts a week already reach the guideline.", "moreAr": "خمس حصص تمرين مدة كل منها 30 دقيقة تكفي للوصول إلى التوصية."}, {"id": "w07", "c": "health", "en": "Walking more is linked with living longer: about 6,000 to 8,000 steps a day for adults over 60, and 8,000 to 10,000 for younger adults.", "ar": "المشي أكثر مرتبط بعمر أطول: حوالي 6,000 إلى 8,000 خطوة يوميًا لمن فوق 60، و8,000 إلى 10,000 للأصغر سنًا.", "by": "Paluch et al., The Lancet Public Health, 2022 (meta-analysis)"}, {"id": "w08", "c": "family", "en": "Couples who stayed together in a long study “turned toward” each other’s small requests for attention far more often than couples who later separated: 86% against 33%.", "ar": "الأزواج الذين استمروا في دراسة طويلة كانوا يستجيبون لطلبات الانتباه الصغيرة من شريكهم أكثر بكثير ممن انفصلوا لاحقًا: 86% مقابل 33%.", "by": "John Gottman’s research on newlyweds, The Gottman Institute", "moreEn": "A bid can be as small as “look at this”. Answering it counts.", "moreAr": "قد يكون الطلب بسيطًا مثل «انظر إلى هذا». والاستجابة له لها قيمة."}, {"id": "w09", "c": "family", "en": "The Harvard Study of Adult Development, running since 1938, found that the quality of close relationships predicted health and happiness in old age better than wealth or fame.", "ar": "دراسة هارفارد للتطور البشري، المستمرة منذ 1938، وجدت أن جودة العلاقات القريبة تتنبأ بالصحة والسعادة في الكبر أفضل من الثروة أو الشهرة.", "by": "Waldinger and Schulz, The Good Life, 2023"}, {"id": "w10", "c": "family", "en": "A large analysis of studies found that reading with young children is linked to better language and early reading skills.", "ar": "تحليل كبير للدراسات وجد أن القراءة مع الأطفال الصغار مرتبطة بمهارات لغوية وقرائية مبكرة أفضل.", "by": "Bus, van IJzendoorn and Pellegrini, Review of Educational Research, 1995 (meta-analysis of joint book reading)", "moreEn": "Your bedtime story is not only sweet. It builds words.", "moreAr": "قصة ما قبل النوم ليست لطيفة فقط، بل تبني الكلمات."}, {"id": "w11", "c": "heart", "en": "People who wrote down a few things they were grateful for each week reported being more optimistic and feeling better about their lives.", "ar": "الناس الذين كتبوا بعض الأشياء التي يشكرون عليها كل أسبوع قالوا إنهم أكثر تفاؤلًا وأفضل شعورًا تجاه حياتهم.", "by": "Emmons and McCullough, Journal of Personality and Social Psychology, 2003"}, {"id": "w12", "c": "heart", "en": "Spending a small amount of money on others made people happier than spending it on themselves.", "ar": "إنفاق مبلغ صغير على الآخرين جعل الناس أسعد من إنفاقه على أنفسهم.", "by": "Dunn, Aknin and Norton, Science, 2008", "moreEn": "The same pattern appeared in a survey across 136 countries (Aknin et al., 2013).", "moreAr": "ونفس النمط ظهر في مسح شمل 136 دولة (أكنين وزملاؤه، 2013)."}, {"id": "w13", "c": "faith", "en": "The first word revealed of the Qur’an was “Read”. Learning is part of faith from the very first moment.", "ar": "أول كلمة نزلت من القرآن هي «اقرأ». فالتعلّم جزء من الإيمان من اللحظة الأولى.", "by": "Qur’an 96:1"}, {"id": "w14", "c": "faith", "en": "The Prophet ﷺ used to fast on Mondays and Thursdays and said that deeds are presented on those days, and that he likes his deeds to be presented while he is fasting.", "ar": "كان النبي ﷺ يصوم الاثنين والخميس، وقال إن الأعمال تُعرض فيهما، وأحب أن يُعرض عملي وأنا صائم.", "by": "Sunan at-Tirmidhi 747"}, {"id": "w15", "c": "faith", "en": "A hadith says the one who is skilled in the Qur’an is with the noble angels, and the one who recites with difficulty has a double reward.", "ar": "في الحديث أن الماهر بالقرآن مع الملائكة الكرام، والذي يقرؤه ويشق عليه له أجران.", "by": "Sahih al-Bukhari 4937, Sahih Muslim 798", "moreEn": "So if reading feels hard some days, that effort is counted.", "moreAr": "فلو القراءة صعبة بعض الأيام، فإن التعب نفسه محسوب."}, {"id": "w16", "c": "money", "en": "Setting aside 500 EGP a month adds up to 6,000 a year and 60,000 in ten years before any return. The habit matters more than the amount.", "ar": "ادّخار 500 جنيه شهريًا يعني 6,000 في السنة و60,000 في عشر سنوات قبل أي عائد. العادة أهم من المبلغ.", "by": "Simple arithmetic"}, {"id": "w17", "c": "science", "en": "People who keep track of their progress toward a goal are more likely to reach it, and writing it down helps even more.", "ar": "الناس الذين يتابعون تقدّمهم نحو هدف أكثر احتمالًا لبلوغه، والكتابة تساعد أكثر.", "by": "Harkin et al., Psychological Bulletin, 2016 (meta-analysis of 138 studies)", "moreEn": "That is exactly what logging your spending and your habits does.", "moreAr": "وهذا بالضبط ما يفعله تسجيل مصروفك وعاداتك."}, {"id": "w18", "c": "science", "en": "Studies of habit change find that a small win repeated is more reliable than a big push. Starting with two minutes beats waiting for the perfect hour.", "ar": "دراسات تغيير العادات تجد أن مكسبًا صغيرًا متكررًا أكثر ثباتًا من دفعة كبيرة. البدء بدقيقتين أفضل من انتظار الساعة المثالية.", "by": "BJ Fogg, Tiny Habits · James Clear, Atomic Habits"}, {"id": "w19", "c": "health", "en": "Drinking water through the day is easier than catching up in the evening. Six glasses is about 1.5 litres.", "ar": "شرب الماء على مدار اليوم أسهل من التعويض في المساء. ستة أكواب تقريبًا 1.5 لتر.", "by": "EFSA water intake opinion, 2010"}, {"id": "w20", "c": "science", "en": "Reading books is linked with living longer. In one 12-year study of 3,635 adults, book readers had about 20% lower risk of dying than non-readers.", "ar": "قراءة الكتب مرتبطة بعمر أطول. في دراسة لمدة 12 سنة على 3,635 بالغًا، كان خطر الوفاة عند قراء الكتب أقل بحوالي 20% من غير القراء.", "by": "Bavishi et al., Social Science & Medicine, 2016", "moreEn": "An association, not proof. But it is a good reason to keep the book by the bed.", "moreAr": "ارتباط وليس دليلًا. لكن سبب جيد لتبقي الكتاب جنب السرير."}, {"id": "w21", "c": "business", "en": "Many successful companies began by talking to a handful of real customers before building. A few honest conversations can save months.", "ar": "كثير من الشركات الناجحة بدأت بالحديث مع عدد قليل من الزبائن الحقيقيين قبل البناء. بضع محادثات صريحة قد توفّر أشهرًا.", "by": "Steve Blank, The Four Steps to the Epiphany · Eric Ries, The Lean Startup"}, {"id": "w22", "c": "science", "en": "Habits form by repeating a behaviour in the same context. The rewards you feel right away matter more than the benefits that come months later.", "ar": "العادات تتكوّن بتكرار السلوك في نفس السياق. المكافآت التي تشعر بها فورًا أهم من الفوائد التي تأتي بعد شهور.", "by": "Wendy Wood, Good Habits, Bad Habits, 2019"}, {"id": "w24", "c": "faith", "en": "The Prophet ﷺ said that a righteous deed done after a bad one wipes it out: “Follow a bad deed with a good deed and it will erase it.”", "ar": "قال النبي ﷺ: «أتبع السيئة الحسنة تمحها». كل مرة ترجع فيها هي فرصة جديدة.", "by": "Sunan at-Tirmidhi 1987"}, {"id": "w25", "c": "life", "en": "The habit-tracking idea is old: Benjamin Franklin kept a weekly chart of virtues and marked every slip with a dot, aiming for fewer dots over time.", "ar": "فكرة تتبّع العادات قديمة: بنجامين فرانكلين كان يحتفظ بجدول أسبوعي للفضائل ويضع نقطة عند كل زلّة، ليقلّ عدد النقاط مع الوقت.", "by": "Benjamin Franklin, Autobiography"}, {"id": "w26", "c": "faith", "en": "Muhasaba, taking account of yourself, is an old practice in Islamic spirituality. A short check-in each day is exactly that.", "ar": "المحاسبة ممارسة قديمة في التزكية الإسلامية. وتسجيل يومي قصير هو ذلك بالضبط.", "by": "Al-Ghazali, Ihya’ Ulum al-Din"}, {"id": "w27", "c": "health", "en": "Regular weigh-ins make slow changes visible, and visible progress keeps people going. Same day, same conditions, and watch the trend, not a single reading.", "ar": "قياس الوزن بانتظام يجعل التغيّرات البطيئة ظاهرة، والتقدّم الظاهر يشجّع على الاستمرار. نفس اليوم ونفس الظروف، وانظر إلى الاتجاه وليس قراءة واحدة.", "by": "Self-monitoring research, e.g. Burke et al., Journal of the American Dietetic Association, 2011"}, {"id": "w29", "c": "money", "en": "Cooking at home is usually far cheaper than ordering. Choosing three delivery nights a week in advance turns an impulse into a plan.", "ar": "الطبخ في البيت عادة أرخص بكثير من الطلب. اختيار ثلاث ليالي توصيل في الأسبوع مسبقًا يحوّل الاندفاع إلى خطة.", "by": "General household budgeting guidance"}, {"id": "w30", "c": "heart", "en": "Time alone to rest and recharge is linked with lower stress. Putting it in the calendar first protects it from what is left over.", "ar": "الوقت الخاص للراحة وإعادة الشحن مرتبط بتوتر أقل. وضعه في الجدول أولًا يحميه من أن يكون ما تبقّى.", "by": "Recovery from stress research (Sonnentag and colleagues)"}], "dash": [{"id": "d01", "c": "history", "en": "Fatima al-Fihri used her inheritance to found a mosque and school in Fez in 859. It grew into al-Qarawiyyin, recognised as the oldest continually operating university in the world.", "ar": "فاطمة الفهرية أنفقت ميراثها لتؤسس مسجدًا ومدرسة في فاس عام 859، ونمت لتصبح جامعة القرويين، المعترف بها كأقدم جامعة مستمرة في العمل في العالم.", "by": "History of al-Qarawiyyin · UNESCO and Guinness World Records", "moreEn": "She did not build it in a day. She watched the walls rise over years, and it is said she fasted until the work was complete. One steady act of giving became a place where people have learned for more than eleven centuries.", "moreAr": "لم تبنِها في يوم. تابعت ارتفاع الجدران عبر سنين، ويُروى أنها صامت حتى اكتمل البناء. عطاء واحد ثابت صار مكانًا يتعلم فيه الناس منذ أكثر من أحد عشر قرنًا."}, {"id": "d02", "c": "history", "en": "Al-Khwarizmi wrote a short book around 820 on solving equations. Its title, al-jabr, gave us the word algebra, and his name gave us algorithm.", "ar": "الخوارزمي كتب حوالي عام 820 كتابًا قصيرًا في حلّ المعادلات. عنوانه «الجبر» أعطانا كلمة algebra، واسمه أعطانا كلمة algorithm.", "by": "Al-Khwarizmi, The Compendious Book on Calculation by Completion and Balancing", "moreEn": "He worked at the House of Wisdom in Baghdad, where translators and scientists studied side by side. A daily habit of careful thinking left a mark on every phone and computer today.", "moreAr": "عمل في بيت الحكمة ببغداد حيث كان المترجمون والعلماء يدرسون جنبًا إلى جنب. عادة يومية من التفكير الدقيق تركت أثرها في كل هاتف وحاسوب اليوم."}, {"id": "d03", "c": "history", "en": "Ibn al-Haytham wrote his Book of Optics while confined at home in Cairo in the early 1000s. He insisted on testing ideas with experiments, which helped shape modern scientific method.", "ar": "ابن الهيثم ألّف «كتاب المناظر» وهو محتجز في بيته بالقاهرة في أوائل القرن الحادي عشر. أصرّ على اختبار الأفكار بالتجارب، فساهم في تشكيل المنهج العلمي الحديث.", "by": "Ibn al-Haytham, Kitab al-Manazir", "moreEn": "He was reportedly confined for about ten years. Limits did not stop him. They narrowed his focus.", "moreAr": "يُروى أنه ظل محتجزًا حوالي عشر سنوات. القيود لم توقفه، بل ضيّقت تركيزه."}, {"id": "d04", "c": "history", "en": "Imam al-Bukhari spent about sixteen years compiling his Sahih, choosing roughly 7,000 reports from hundreds of thousands. It is said he prayed two rak‘ahs before including each one.", "ar": "الإمام البخاري قضى حوالي ست عشرة سنة في جمع صحيحه، واختار نحو 7,000 رواية من مئات الآلاف. ويُروى أنه كان يصلي ركعتين قبل إدراج كل حديث.", "by": "Biographical tradition on al-Bukhari", "moreEn": "A long work is made of daily pages. Sixteen years is only about 5,800 days.", "moreAr": "العمل الطويل مصنوع من صفحات يومية. ست عشرة سنة ليست إلا حوالي 5,800 يوم."}, {"id": "d05", "c": "history", "en": "Khadija bint Khuwaylid ran a successful trading business in Mecca and became the first to believe in the Prophet ﷺ. She stood by him with her wealth, her word and her calm.", "ar": "خديجة بنت خويلد أدارت تجارة ناجحة في مكة وكانت أول من آمن بالنبي ﷺ. وقفت معه بمالها وكلمتها وسكينتها.", "by": "Ibn Hisham, Sirah", "moreEn": "A woman who built a business and a family at the same time. A reminder that work and home can strengthen each other.", "moreAr": "امرأة بنت تجارة وأسرة في الوقت نفسه. تذكير بأن العمل والبيت يقوّي أحدهما الآخر."}, {"id": "d06", "c": "history", "en": "Uthman ibn Affan bought the well of Rumah in Madinah and made it available to all Muslims at a time when water was scarce.", "ar": "عثمان بن عفان اشترى بئر رومة في المدينة وجعلها متاحة لكل المسلمين في وقت كان الماء فيه قليلًا.", "by": "Sunan at-Tirmidhi 3703", "moreEn": "One decision to give kept benefiting people for generations. Giving is a habit that outlives the giver.", "moreAr": "قرار واحد بالعطاء ظل ينفع الناس أجيالًا. العطاء عادة تعيش بعد صاحبها."}, {"id": "d07", "c": "history", "en": "Ibn Sina’s Canon of Medicine was used as a medical textbook in Europe and the Islamic world for around six centuries.", "ar": "«القانون في الطب» لابن سينا استُخدم كتابًا طبيًا في أوروبا والعالم الإسلامي لحوالي ستة قرون.", "by": "Ibn Sina, al-Qanun fi’l-Tibb", "moreEn": "He wrote while serving as a physician and adviser, fitting study into busy days. Consistent small time blocks make big books.", "moreAr": "كتب وهو طبيب ومستشار، فكان يجد وقتًا للدراسة وسط الانشغال. فترات الوقت الصغيرة المنتظمة تصنع كتبًا كبيرة."}, {"id": "d08", "c": "history", "en": "Ibn Battuta set out for Hajj at 21 and kept travelling for almost thirty years, covering roughly 120,000 km across Africa, Asia and Europe.", "ar": "ابن بطوطة خرج للحج وعمره 21 سنة وظل يسافر قرابة ثلاثين عامًا، قاطعًا نحو 120,000 كم في أفريقيا وآسيا وأوروبا.", "by": "Ibn Battuta, Rihla", "moreEn": "It began with one journey and a single step. Curiosity, repeated daily, becomes a life.", "moreAr": "بدأت برحلة واحدة وخطوة واحدة. الفضول مع التكرار اليومي يصير حياة."}, {"id": "d09", "c": "science", "en": "Marie Curie is the only person to win Nobel Prizes in two different sciences: Physics in 1903 and Chemistry in 1911.", "ar": "ماري كوري هي الشخص الوحيد الذي فاز بجائزة نوبل في علمين مختلفين: الفيزياء عام 1903 والكيمياء عام 1911.", "by": "Nobel Prize organisation", "moreEn": "Her work involved years of patient, repetitive lab work with tons of ore to isolate a tiny amount of radium. Progress was slow until it was suddenly real.", "moreAr": "شمل عملها سنوات من العمل المخبري الصبور والمتكرر على أطنان من الخام لعزل كمية صغيرة من الراديوم. كان التقدم بطيئًا حتى صار حقيقيًا فجأة."}, {"id": "d10", "c": "science", "en": "Ahmed Zewail, born in Egypt, won the 1999 Nobel Prize in Chemistry for using ultra-fast lasers to watch chemical reactions as they happen, in femtoseconds.", "ar": "أحمد زويل، المولود في مصر، فاز بجائزة نوبل في الكيمياء عام 1999 لاستخدامه ليزر فائق السرعة لمراقبة التفاعلات الكيميائية لحظة حدوثها، بالفيمتوثانية.", "by": "Nobel Prize organisation", "moreEn": "He was born in Damanhur, raised in Disuq and studied at Alexandria University. A boy from the Egyptian Delta changed how the world sees molecules.", "moreAr": "وُلد في دمنهور ونشأ في دسوق ودرس في جامعة الإسكندرية. فتى من دلتا مصر غيّر الطريقة التي يرى بها العالم الجزيئات."}, {"id": "d11", "c": "science", "en": "Magdi Yacoub, an Egyptian-born heart surgeon, pioneered heart and transplant surgery, then helped found the Aswan Heart Centre, which provides free care.", "ar": "مجدي يعقوب، جرّاح القلب المولود في مصر، كان رائدًا في جراحات القلب والزراعة، ثم ساهم في تأسيس مركز أسوان للقلب الذي يقدّم العلاج مجانًا.", "by": "Aswan Heart Centre · Magdi Yacoub Foundation", "moreEn": "Excellence in his craft and generosity with it. The two together are what make a legacy.", "moreAr": "التميز في مهنته والكرم بها. الاثنان معًا هما ما يصنع الأثر."}, {"id": "d12", "c": "science", "en": "Katherine Johnson’s calculations helped NASA launch the first American astronauts. In 1962 John Glenn asked for her to check the computer’s numbers before his orbital flight.", "ar": "حسابات كاثرين جونسون ساعدت ناسا في إطلاق أوائل الرواد الأمريكيين. في 1962 طلب جون غلين أن تراجع هي أرقام الحاسوب قبل رحلته المدارية.", "by": "NASA biography", "moreEn": "People trusted her because she checked the details, every time.", "moreAr": "وثق بها الناس لأنها تراجع التفاصيل في كل مرة."}, {"id": "d13", "c": "science", "en": "Beethoven premiered his Ninth Symphony in 1824 when he was almost completely deaf. He had to be turned around at the end to see the applause.", "ar": "بيتهوفن قدّم سيمفونيته التاسعة لأول مرة عام 1824 وهو أصمّ تقريبًا. وأُدير ليرى التصفيق في النهاية.", "by": "Contemporary accounts of the 1824 premiere", "moreEn": "The habit of composing every day did not stop when circumstances changed.", "moreAr": "عادة التأليف اليومية لم تتوقف حين تغيّرت الظروف."}, {"id": "d14", "c": "life", "en": "Nelson Mandela spent 27 years in prison and was elected President of South Africa in 1994, choosing reconciliation over revenge.", "ar": "نيلسون مانديلا قضى 27 عامًا في السجن وانتُخب رئيسًا لجنوب أفريقيا عام 1994، واختار المصالحة بدل الانتقام.", "by": "Nelson Mandela Foundation", "moreEn": "In prison he kept to a strict daily routine of exercise, reading and letters. Routine kept him whole.", "moreAr": "في السجن التزم بروتين يومي صارم من التمارين والقراءة والرسائل. الروتين حافظ على تماسكه."}, {"id": "d15", "c": "life", "en": "Helen Keller, deaf and blind from the age of 19 months, graduated from Radcliffe College with honours in 1904 and became an author and activist.", "ar": "هيلين كيلر، الصماء والعمياء منذ عمر 19 شهرًا، تخرّجت بتفوق من كلية رادكليف عام 1904 وصارت كاتبة وناشطة.", "by": "American Foundation for the Blind", "moreEn": "Her teacher Anne Sullivan began with one word at a time spelled into her hand. Small steps, repeated with love.", "moreAr": "بدأت معلمتها آن سوليفان بكلمة واحدة في كل مرة تُهجّى على يدها. خطوات صغيرة مكررة بمحبة."}, {"id": "d16", "c": "life", "en": "Malala Yousafzai became the youngest Nobel Peace Prize laureate at 17 in 2014, after speaking up for girls’ education.", "ar": "ملالا يوسفزاي أصبحت أصغر حائزة على جائزة نوبل للسلام وعمرها 17 عامًا عام 2014، بعد أن رفعت صوتها من أجل تعليم الفتيات.", "by": "Nobel Prize organisation", "moreEn": "She started by writing a diary and speaking up, one sentence at a time.", "moreAr": "بدأت بكتابة مذكرات والكلام، جملة بعد جملة."}, {"id": "d17", "c": "life", "en": "Roger Bannister ran the first mile under four minutes in 1954. Within about seven weeks another runner did it too, and many followed.", "ar": "روجر بانيستر ركض أول ميل في أقل من أربع دقائق عام 1954. وبعد حوالي سبعة أسابيع فعلها عدّاء آخر، وتبعه كثيرون.", "by": "Athletics records and press accounts", "moreEn": "Once a barrier is proven breakable, others find the courage. Your progress also makes it easier for someone near you.", "moreAr": "حين يثبت أن الحاجز قابل للكسر، يجد غيره الشجاعة. وتقدّمك يسهّل على من حولك."}, {"id": "d18", "c": "life", "en": "The Wright brothers built bicycles by trade. On 17 December 1903 their first powered flight lasted 12 seconds and covered 120 feet. The fourth flight that day lasted 59 seconds.", "ar": "الأخوان رايت كانا يصنعان الدراجات. في 17 ديسمبر 1903 دامت رحلتهما الأولى 12 ثانية وقطعت 120 قدمًا. والرحلة الرابعة في اليوم نفسه دامت 59 ثانية.", "by": "Smithsonian National Air and Space Museum", "moreEn": "Twelve seconds changed the century. Never judge a beginning by its length.", "moreAr": "اثنتا عشرة ثانية غيّرت القرن. لا تحكم على البداية بطولها."}, {"id": "d19", "c": "business", "en": "Airbnb’s founders paid early bills by selling cereal boxes themed on the 2008 US election. The idea of strangers sharing homes then grew into a global company.", "ar": "مؤسسو إيربنب سدّدوا فواتيرهم المبكرة ببيع علب حبوب بتصميم مرتبط بانتخابات أمريكا 2008. ثم نمت فكرة مشاركة البيوت بين الغرباء لتصبح شركة عالمية.", "by": "Reported widely, e.g. Y Combinator and Brian Chesky interviews", "moreEn": "They did something small and real to survive, and listened to the first customers closely.", "moreAr": "فعلوا شيئًا صغيرًا وحقيقيًا ليستمروا، وأنصتوا جيدًا لأوائل الزبائن."}, {"id": "d20", "c": "business", "en": "Amazon started in 1994 from a garage in Bellevue as an online bookstore.", "ar": "بدأت أمازون عام 1994 من جراج في بيلفيو كمتجر كتب إلكتروني.", "by": "Amazon company history", "moreEn": "Starting with one category and doing it well, then expanding step by step.", "moreAr": "البدء بفئة واحدة وإتقانها، ثم التوسع خطوة خطوة."}, {"id": "d21", "c": "business", "en": "Toyota built its production system on kaizen: small improvements made every day by everyone. The habit of tiny fixes compounded into world-class quality.", "ar": "بنت تويوتا نظامها الإنتاجي على الكايزن: تحسينات صغيرة كل يوم من الجميع. عادة التعديلات الصغيرة تراكمت لتصنع جودة عالمية.", "by": "Toyota Production System", "moreEn": "Improve one small thing, then the next. That is a month, a year, a company.", "moreAr": "حسّن شيئًا صغيرًا ثم الذي بعده. هذا شهر، ثم سنة، ثم شركة."}, {"id": "d22", "c": "life", "en": "J. K. Rowling’s first Harry Potter manuscript was turned down by around a dozen publishers before Bloomsbury accepted it in 1996.", "ar": "مخطوطة هاري بوتر الأولى لـج. ك. رولينغ رفضها حوالي اثني عشر ناشرًا قبل أن تقبلها بلومزبري عام 1996.", "by": "Bloomsbury and published interviews", "moreEn": "She kept sending. Rejection is part of the route, not the end of it.", "moreAr": "واصلت الإرسال. الرفض جزء من الطريق وليس نهايته."}, {"id": "d23", "c": "history", "en": "Mansa Musa of Mali made his pilgrimage to Mecca in 1324 with a huge caravan and gave so much gold along the way that prices in Cairo are said to have been affected for years.", "ar": "منسا موسى ملك مالي أدّى الحج عام 1324 بقافلة ضخمة ووزّع ذهبًا كثيرًا في الطريق حتى يُقال إن الأسعار في القاهرة تأثرت لسنوات.", "by": "Al-Umari and other medieval accounts", "moreEn": "Planning, generosity and a clear purpose.", "moreAr": "تخطيط وسخاء وغاية واضحة."}, {"id": "d24", "c": "history", "en": "Aisha bint Abu Bakr transmitted over two thousand hadiths and taught many Companions and their students. Scholars returned to her for answers.", "ar": "عائشة بنت أبي بكر روت أكثر من ألفي حديث وعلّمت كثيرًا من الصحابة وتلاميذهم، وكان العلماء يرجعون إليها.", "by": "Classical biographical works", "moreEn": "Knowledge held and shared in the home became a school for a community.", "moreAr": "علم حُفظ ونُشر من البيت صار مدرسة لأمة."}, {"id": "d25", "c": "life", "en": "Abdul Sattar Edhi started with one old ambulance in Karachi and built one of the largest volunteer ambulance networks in the world, often answering the calls himself.", "ar": "عبد الستار إيدهي بدأ بسيارة إسعاف قديمة واحدة في كراتشي وبنى واحدة من أكبر شبكات الإسعاف التطوعية في العالم، وكان كثيرًا ما يردّ على النداءات بنفسه.", "by": "Edhi Foundation", "moreEn": "One vehicle, one person, done every day.", "moreAr": "سيارة واحدة وشخص واحد وعمل يومي."}, {"id": "d26", "c": "history", "en": "Naguib Mahfouz, the Egyptian novelist, won the 1988 Nobel Prize in Literature. He kept a strict daily writing schedule for decades.", "ar": "نجيب محفوظ، الروائي المصري، فاز بجائزة نوبل في الأدب عام 1988. وحافظ على جدول كتابة يومي صارم لعقود.", "by": "Nobel Prize organisation", "moreEn": "Early mornings, day after day, years of Cairo stories. Genius needs a schedule.", "moreAr": "ساعات الصباح الأولى يومًا بعد يوم، سنوات من حكايات القاهرة. العبقرية تحتاج جدولًا."}, {"id": "d28", "c": "history", "en": "Sumayyah bint Khayyat was the first martyr in Islam. She held firm under severe pressure, and her family’s patience is remembered as an example for all time.", "ar": "سمية بنت خياط أول شهيدة في الإسلام. ثبتت تحت ضغط شديد، وصبر أسرتها يُذكر مثالًا على مر الزمان.", "by": "Ibn Sa‘d, al-Tabaqat", "moreEn": "Steadiness is a form of courage.", "moreAr": "الثبات شكل من أشكال الشجاعة."}], "impact": [{"id": "b01", "c": "book", "en": "Getting 1% better each day looks like nothing today, but over a year it compounds into a very different person.", "ar": "التحسّن 1% كل يوم لا يبدو شيئًا اليوم، لكن على مدار سنة يتراكم ليصنع شخصًا مختلفًا تمامًا.", "by": "Atomic Habits · James Clear", "moreEn": "The size of the daily step matters less than never stopping. Small gains arrive quietly and keep stacking.", "moreAr": "حجم الخطوة اليومية أقل أهمية من عدم التوقف. المكاسب الصغيرة تأتي بهدوء وتتراكم."}, {"id": "b02", "c": "book", "en": "Aim at who you want to become, not only what you want to get. Each tick is a vote for the kind of person you are.", "ar": "استهدف من تريد أن تصبح، لا ما تريد أن تحصل عليه فقط. كل علامة صح هي صوت لصالح نوع الشخص الذي أنت عليه.", "by": "Atomic Habits · James Clear", "moreEn": "“I am someone who reads every day” is a stronger anchor than “I want to finish a book”.", "moreAr": "«أنا شخص يقرأ كل يوم» مرساة أقوى من «أريد أن أنهي كتابًا»."}, {"id": "b03", "c": "book", "en": "Attach a new habit to one you already do. “After I pray Fajr, I read my two pages.” The old habit becomes the reminder for the new one.", "ar": "اربط عادة جديدة بعادة تفعلها أصلًا. «بعد صلاة الفجر أقرأ صفحتيّ». العادة القديمة تصبح تذكيرًا بالجديدة.", "by": "Atomic Habits · James Clear (habit stacking)"}, {"id": "b04", "c": "book", "en": "The two-minute rule: shrink a habit until it takes two minutes. Becoming someone who starts matters more than finishing big at first.", "ar": "قاعدة الدقيقتين: صغّر العادة حتى تستغرق دقيقتين. أن تصبح شخصًا يبدأ أهم في البداية من الإنجاز الكبير.", "by": "Atomic Habits · James Clear", "moreEn": "Put on your shoes. Open the book. Write one line. The rest tends to follow.", "moreAr": "البس الحذاء. افتح الكتاب. اكتب سطرًا. والباقي غالبًا يتبع."}, {"id": "b05", "c": "book", "en": "Never miss twice. One missed day is an accident. Two in a row is the start of a new habit you did not choose.", "ar": "لا تفوّت مرتين. يوم واحد فائت حادث. يومان متتاليان بداية عادة جديدة لم تخترها.", "by": "Atomic Habits · James Clear"}, {"id": "b06", "c": "book", "en": "Design your surroundings so the good habit is visible and easy, and the unwanted one takes effort. Put the Qur’an where you sit, the phone away from the bed.", "ar": "صمّم محيطك بحيث تكون العادة الجيدة ظاهرة وسهلة، والعادة غير المرغوبة تحتاج جهدًا. ضع المصحف حيث تجلس، والهاتف بعيدًا عن السرير.", "by": "Atomic Habits · James Clear"}, {"id": "b07", "c": "book", "en": "Make a habit satisfying right away. A small immediate reward, like a tick you can see, keeps you coming back.", "ar": "اجعل العادة مُرضية فورًا. مكافأة صغيرة فورية، مثل علامة صح تراها، تجعلك تعود.", "by": "Atomic Habits · James Clear · Tiny Habits, BJ Fogg"}, {"id": "b08", "c": "book", "en": "Every habit is a loop: a cue, a routine and a reward. To change a habit, keep the cue and the reward and swap the routine.", "ar": "كل عادة هي حلقة: إشارة وروتين ومكافأة. لتغيير عادة، أبقِ الإشارة والمكافأة وبدّل الروتين.", "by": "The Power of Habit · Charles Duhigg", "moreEn": "Craving is what drives the loop. Find what you are really seeking, such as rest or company, and meet it in a better way.", "moreAr": "الرغبة هي ما يحرّك الحلقة. اكتشف ما تبحث عنه فعلًا، مثل الراحة أو الصحبة، وأشبعه بطريقة أفضل."}, {"id": "b09", "c": "book", "en": "Some habits, called keystone habits, start a chain reaction. A single change, like regular exercise, can lift eating, sleep and mood without extra effort.", "ar": "بعض العادات، وتسمى العادات المحورية، تبدأ تفاعلًا متسلسلًا. تغيير واحد مثل التمرين المنتظم قد يرفع الأكل والنوم والمزاج دون جهد إضافي.", "by": "The Power of Habit · Charles Duhigg"}, {"id": "b10", "c": "book", "en": "Small wins build confidence. Finish one small thing today and let it make the next one easier.", "ar": "الانتصارات الصغيرة تبني الثقة. أنجز شيئًا صغيرًا اليوم ودعه يجعل التالي أسهل.", "by": "The Power of Habit · Charles Duhigg"}, {"id": "b11", "c": "book", "en": "Belief changes when you do it with others. Habits stick better in a community, and you two are each other’s community.", "ar": "الاعتقاد يتغير حين تفعل مع الآخرين. العادات تثبت أكثر في مجتمع، وأنتما مجتمع بعضكما.", "by": "The Power of Habit · Charles Duhigg"}, {"id": "b12", "c": "book", "en": "You cannot care about everything. Choose a few things worth caring about, and accept the cost of the rest.", "ar": "لا تستطيع أن تهتم بكل شيء. اختر أشياء قليلة تستحق الاهتمام، واقبل ثمن الباقي.", "by": "The Subtle Art of Not Giving a F*ck · Mark Manson"}, {"id": "b13", "c": "book", "en": "Problems never end, they only change. Happiness comes from choosing better problems to work on.", "ar": "المشاكل لا تنتهي، بل تتغير. السعادة تأتي من اختيار مشاكل أفضل تعمل عليها.", "by": "The Subtle Art of Not Giving a F*ck · Mark Manson"}, {"id": "b14", "c": "book", "en": "You do not always need motivation to start. Action creates motivation. Do something small, and the feeling follows.", "ar": "لا تحتاج دائمًا إلى دافع لتبدأ. الفعل هو من يصنع الدافع. افعل شيئًا صغيرًا ثم يأتي الشعور.", "by": "The Subtle Art of Not Giving a F*ck · Mark Manson"}, {"id": "b15", "c": "book", "en": "Take responsibility for how you respond, even when something was not your fault. That is where your power lives.", "ar": "تحمّل مسؤولية طريقة ردّك، حتى لو لم يكن الخطأ خطأك. هناك تكمن قوتك.", "by": "The Subtle Art of Not Giving a F*ck · Mark Manson"}, {"id": "b16", "c": "book", "en": "Do the most important work in long, protected, distraction-free blocks. Deep focus is rare, so it is valuable.", "ar": "أنجز أهم عمل في فترات طويلة محمية بلا مشتتات. التركيز العميق نادر، ولذلك هو ثمين.", "by": "Deep Work · Cal Newport"}, {"id": "b17", "c": "book", "en": "Do fewer things, but the right ones. Saying no to good options is how you make room for the great one.", "ar": "افعل أقل، لكن الأشياء الصحيحة. قول لا لخيارات جيدة هو ما يفسح مكانًا للخيار العظيم.", "by": "Essentialism · Greg McKeown"}, {"id": "b18", "c": "book", "en": "Talent counts, but effort counts twice: once to build skill, and again to turn skill into achievement.", "ar": "الموهبة مهمة، لكن الجهد يُحسب مرتين: مرة لبناء المهارة ومرة لتحويلها إلى إنجاز.", "by": "Grit · Angela Duckworth"}, {"id": "b19", "c": "book", "en": "Add the word “yet”. “I can’t do it” becomes “I can’t do it yet”, and effort begins to feel like growth.", "ar": "أضف كلمة «بعد». «لا أستطيع» تصبح «لا أستطيع بعد»، ويبدأ الجهد يبدو كنمو.", "by": "Mindset · Carol Dweck"}, {"id": "b20", "c": "book", "en": "Begin with the end in mind. Ask what you want your family to say about you in ten years, then work backwards.", "ar": "ابدأ والنهاية في ذهنك. اسأل ماذا تريد أن تقول أسرتك عنك بعد عشر سنوات، ثم اعمل بالعكس.", "by": "The 7 Habits of Highly Effective People · Stephen Covey"}, {"id": "b21", "c": "book", "en": "Put first things first. Spend more time on what is important but not urgent, like health, relationships and planning, before it becomes an emergency.", "ar": "ضع الأهم أولًا. اقضِ وقتًا أكبر فيما هو مهم وغير عاجل، مثل الصحة والعلاقات والتخطيط، قبل أن يتحول إلى طارئ.", "by": "The 7 Habits of Highly Effective People · Stephen Covey"}, {"id": "b22", "c": "book", "en": "Wealth is what you do not spend. Savings come from the gap between your ego and your income, so build that gap on purpose.", "ar": "الثروة هي ما لا تنفقه. الادخار يأتي من الفجوة بين الغرور والدخل، فابنِ هذه الفجوة عن قصد.", "by": "The Psychology of Money · Morgan Housel"}, {"id": "b23", "c": "book", "en": "Pay yourself first. Set aside a fixed part of every income before you spend any of it.", "ar": "ادفع لنفسك أولًا. اترك جزءًا ثابتًا من كل دخل قبل أن تنفق منه شيئًا.", "by": "The Richest Man in Babylon · George S. Clason"}, {"id": "b24", "c": "book", "en": "Build, measure, learn. Make the smallest version you can, show it to real people, and let their reaction guide the next step.", "ar": "ابنِ، قِس، تعلّم. اصنع أصغر نسخة ممكنة، واعرضها على أناس حقيقيين، ودع ردّ فعلهم يوجّه الخطوة التالية.", "by": "The Lean Startup · Eric Ries"}, {"id": "b25", "c": "book", "en": "When you talk to customers, ask about their lives and their past behaviour, not whether they like your idea. Opinions are cheap, habits are real.", "ar": "حين تتحدث مع الزبائن اسأل عن حياتهم وسلوكهم السابق، لا عن رأيهم في فكرتك. الآراء رخيصة والعادات حقيقية.", "by": "The Mom Test · Rob Fitzpatrick"}, {"id": "b26", "c": "book", "en": "You have about four thousand weeks in a lifetime. You cannot do everything, so choose what to give your time to on purpose.", "ar": "لديك حوالي أربعة آلاف أسبوع في العمر. لا تستطيع أن تفعل كل شيء، فاختر عن قصد ما تمنحه وقتك.", "by": "Four Thousand Weeks · Oliver Burkeman"}, {"id": "b27", "c": "book", "en": "Couples who stay close notice small invitations for attention and respond to them. “Look at that bird” is a bid for connection.", "ar": "الأزواج الذين يبقون قريبين ينتبهون لدعوات الاهتمام الصغيرة ويردّون عليها. «انظر إلى هذا الطائر» طلب للتقارب.", "by": "The Seven Principles for Making Marriage Work · John Gottman"}, {"id": "b28", "c": "book", "en": "People feel loved in different ways: words, time, gifts, help, touch. Learn which one your partner hears most clearly.", "ar": "الناس يشعرون بالحب بطرق مختلفة: كلمات، وقت، هدايا، مساعدة، لمس. اعرف أي لغة يسمعها شريكك بوضوح أكثر.", "by": "The Five Love Languages · Gary Chapman"}, {"id": "b29", "c": "book", "en": "Putting a good deed off until you are free is a trick of the self. Start now, even with a little.", "ar": "تأجيل الخير إلى حين الفراغ من خدع النفس. ابدأ الآن ولو بالقليل.", "by": "Al-Hikam al-‘Ata’iyya · Ibn ‘Ata’illah al-Iskandari", "moreEn": "Ibn ‘Ata’illah taught that postponing deeds until you are free is a folly of the self. Start now, even small.", "moreAr": "ابن عطاء الله علّم أن إحالة الأعمال على وجود الفراغ من حماقة النفس. ابدأ الآن حتى لو صغيرًا."}, {"id": "b30", "c": "book", "en": "People who review themselves each day find it easier to improve. A few minutes at night to look back and plan beat a long burst now and then.", "ar": "من يراجع نفسه كل يوم يسهل عليه أن يتحسّن. دقائق قليلة في الليل للنظر إلى الخلف والتخطيط أنفع من اندفاعة طويلة بين حين وآخر.", "by": "Ihya’ Ulum al-Din · al-Ghazali (muhasaba)"}, {"id": "b31", "c": "book", "en": "Start your day with one small win. Make your bed. It proves that the day has begun and that you keep your word to yourself.", "ar": "ابدأ يومك بانتصار صغير. رتّب سريرك. هذا يثبت أن اليوم بدأ وأنك تفي بوعدك لنفسك.", "by": "Make Your Bed · Admiral William H. McRaven"}, {"id": "b32", "c": "book", "en": "Celebrate right after you do the tiny habit, even with a quiet “well done”. The feeling of success is what wires the habit in.", "ar": "احتفل مباشرة بعد أداء العادة الصغيرة، ولو بكلمة «أحسنت» هادئة. الشعور بالنجاح هو ما يرسّخ العادة.", "by": "Tiny Habits · BJ Fogg"}, {"id": "b33", "c": "book", "en": "Resistance shows up in front of anything worth doing. The professional works anyway, at the same time, every day.", "ar": "المقاومة تظهر أمام كل ما يستحق العمل. المحترف يعمل رغم ذلك، في نفس الوقت، كل يوم.", "by": "The War of Art · Steven Pressfield"}, {"id": "b34", "c": "book", "en": "Small, smart choices repeated for long enough add up to big results. The same is true of small, careless choices.", "ar": "الاختيارات الصغيرة الذكية، حين تتكرر طويلًا، تصنع نتائج كبيرة. والأمر نفسه ينطبق على الاختيارات الصغيرة المهملة.", "by": "The Compound Effect · Darren Hardy"}]}, "impact": {"faith": {"en": {"improve": "Pick the one practice you miss most often, and tie it to a fixed moment, for example Qur'an pages right after Fajr or tafsir right after Maghrib. A time you keep is stronger than a long list you break.", "guidance": "Two pages a day is small enough to keep when life is busy. Read with the meaning in mind, and use tafsir to understand one idea you can act on that day. If you miss a day, return the next day without guilt.", "consistency": "Consistent small acts build closeness to Allah and a steady heart. The Prophet ﷺ taught that the most beloved deeds are the most consistent, even if small. At two pages a day you complete the mushaf in under a year."}, "ar": {"improve": "اختر العبادة التي تفوتك أكثر من غيرها، واربطها بوقت ثابت. مثلًا صفحات القرآن بعد الفجر والتفسير بعد المغرب. وقت تلتزم به أقوى من قائمة طويلة تتركها.", "guidance": "صفحتان في اليوم قدر صغير تقدر تحافظ عليه حتى في الأيام المزدحمة. اقرأ وأنت تفكر في المعنى، واستعن بالتفسير لتفهم فكرة واحدة تعمل بها في يومك. وإذا فاتك يوم ارجع في اليوم التالي بدون لوم.", "consistency": "الأعمال الصغيرة المستمرة تقرّبك من الله وتهدّئ قلبك. قال النبي ﷺ إن أحب الأعمال إلى الله أدومها وإن قل. بصفحتين كل يوم تختم المصحف في أقل من سنة."}, "sources": ["Sahih al-Bukhari 6464 and Sahih Muslim 783 on consistent deeds", "Madinah mushaf: 604 pages", "VanderWeele et al., JAMA Internal Medicine, 2016 (religious service attendance and mortality; not the same as Qur'an reading)"]}, "body": {"en": {"improve": "Look at which days the workout slips, and put it at the same time on those days. Weigh in once a week, same day, same conditions, and look at the trend line, not a single reading.", "guidance": "The World Health Organization recommends at least 150 minutes of moderate activity a week for adults. Five sessions of 30 minutes meet that. Water through the day is easier than catching up in the evening: six glasses is about 1.5 litres. This is general information, not medical advice.", "consistency": "Large studies link meeting the activity guideline with a clearly lower risk of dying early, compared with being inactive. Regular weigh-ins make slow changes visible, and visible progress keeps you going."}, "ar": {"improve": "انظر في أي أيام يفوتك التمرين وضعه في نفس الوقت في هذه الأيام. قِس وزنك مرة في الأسبوع، في نفس اليوم وبنفس الظروف، وانظر إلى الخط العام وليس إلى قراءة واحدة.", "guidance": "توصي منظمة الصحة العالمية البالغين بما لا يقل عن 150 دقيقة نشاط متوسط في الأسبوع. خمس مرات كل مرة 30 دقيقة تكفي. شرب الماء موزعًا على اليوم أسهل من تعويضه في المساء: ستة أكواب تقارب لترًا ونصفًا. هذه معلومات عامة وليست نصيحة طبية.", "consistency": "دراسات كبيرة تربط الوصول إلى الحد الموصى به من النشاط بانخفاض واضح في خطر الوفاة المبكرة مقارنة بقلة الحركة. والقياس الأسبوعي للوزن يُظهر التغيّر البطيء، ورؤية التقدم تساعدك على الاستمرار."}, "sources": ["WHO guidelines on physical activity and sedentary behaviour, 2020", "Arem et al., JAMA Internal Medicine, 2015", "EFSA water intake opinion, 2010"]}, "mind": {"en": {"improve": "Protect the 20 minutes by giving them a name, a time and a place, and by choosing the material in advance so you never spend the time deciding. Pick one podcast a week that is tied to something you are working on.", "guidance": "Learn in a way you can use: after each session, write one line about what you will apply. Rotate between your career skills and broader reading so both stay alive.", "consistency": "Twenty minutes a day on five days is about 100 minutes a week, over 80 hours in a year. Habits like this typically become automatic after about two months of repetition, with a wide individual range."}, "ar": {"improve": "احمِ العشرين دقيقة بأن تعطيها اسمًا ووقتًا ومكانًا، واختر المادة مسبقًا حتى لا تضيع الوقت في الاختيار. واختر بودكاست واحدًا في الأسبوع له علاقة بشيء تعمل عليه.", "guidance": "تعلّم بطريقة تقدر تطبّقها: بعد كل جلسة اكتب سطرًا عن شيء ستعمل به. بدّل بين مهارات عملك والقراءة العامة ليبقى الاثنان حيّين.", "consistency": "عشرون دقيقة في اليوم خمسة أيام تساوي نحو 100 دقيقة في الأسبوع، أي أكثر من 80 ساعة في السنة. وعادة مثل هذه تصير تلقائية في المتوسط بعد نحو شهرين من التكرار، مع اختلاف كبير بين شخص وآخر."}, "sources": ["Lally et al., European Journal of Social Psychology, 2010", "Arithmetic on your own targets"]}, "family": {"en": {"improve": "Put couple time in the calendar like an appointment, and decide the two slots at the start of the week. For the children, a fixed moment such as the bedtime story is easier to keep than a vague plan to play more.", "guidance": "Give full attention in small amounts: phones away, eye contact, one question that is not about logistics. Say one thing you appreciate about each other every day, and be specific.", "consistency": "Long studies find that the quality of close relationships is among the strongest predictors of health and happiness. A review of 148 studies found that people with stronger relationships had about a 50% higher likelihood of survival."}, "ar": {"improve": "ضع وقت الزوجين في التقويم كأنه موعد، وحدّد الوقتين في بداية الأسبوع. ومع الأولاد، لحظة ثابتة مثل قصة ما قبل النوم أسهل في الاستمرار من نية عامة أن تلعب معهم أكثر.", "guidance": "أعطِ انتباهك كاملًا ولو لوقت قصير: الجوال جانبًا، ونظر في العين، وسؤال واحد ليس عن الترتيبات. وقل كل يوم شيئًا واحدًا تقدّره في شريكك، وكن محددًا.", "consistency": "الدراسات الطويلة تجد أن جودة العلاقات القريبة من أقوى ما يتنبأ بالصحة والسعادة. ووجدت مراجعة لـ 148 دراسة أن أصحاب العلاقات الأقوى احتمال بقائهم أحياءً أعلى بنحو 50%."}, "sources": ["Waldinger and Schulz, The Good Life, 2023 (Harvard Study of Adult Development)", "Holt-Lunstad, Smith and Layton, PLoS Medicine, 2010", "Sunan at-Tirmidhi 3895"]}, "money": {"en": {"improve": "Spending: log the day's total every day, even on bad days. A number you see changes behaviour. Delivery: decide on three delivery nights for the week in advance, and plan the other dinners on Sunday. Income: protect the daily 60-minute block at a fixed hour and end it by sending something out.", "guidance": "For {p2}'s business: research feels like progress but only customers and outputs prove it. Aim for one finished thing each week and a few real conversations with possible customers before building more. {p1}: measure the block by what left your hands (applications, messages, pitches), not by hours. This is general guidance, not financial advice.", "consistency": "Staying under the daily limit adds up month after month, and the weekly delivery cap shifts money toward things you value. A steady income effort creates chances over time, and one weekly output turns an idea into a business step by step."}, "ar": {"improve": "المصروف: سجّل إجمالي اليوم كل يوم حتى في الأيام السيئة، فالرقم الذي تراه يغيّر السلوك. التوصيل: حدّد ثلاث ليالي توصيل للأسبوع مسبقًا، وخطّط للعشاء في بقية الأيام يوم الأحد. الدخل: احمِ ساعة العمل اليومية في وقت ثابت وأنهِها بإرسال شيء فعلي.", "guidance": "لمشروع {p2}: البحث يعطي إحساسًا بالتقدم لكن الدليل الحقيقي هو الزبائن والإنجازات. اجعل هدفك إنجازًا واحدًا مكتملًا كل أسبوع وكلامًا حقيقيًا مع زبائن محتملين قبل أن تبني أكثر. ولـ{p1}: قِس الساعة بما خرج من يدك (طلبات وتواصل وعروض) وليس بعدد الساعات. هذا إرشاد عام وليس نصيحة مالية.", "consistency": "الالتزام بالحد اليومي يتراكم شهرًا بعد شهر، وسقف التوصيل الأسبوعي يحوّل المال إلى أشياء تهمّكم أكثر. والجهد المستمر في الدخل يخلق فرصًا مع الوقت، وإنجاز أسبوعي واحد يحوّل الفكرة إلى مشروع خطوة بخطوة."}, "sources": ["Calculated from your own entries", "Customer-development approach: talk to real customers early (Steve Blank; Eric Ries, The Lean Startup)"]}, "heart": {"en": {"improve": "Gratitude works best when it is specific: three real things from today, not a repeated list. Giving can be tiny: a message, a smile, a favour. Put {p2}'s time for herself in the calendar first, so it does not depend on what is left over.", "guidance": "Protect the time for yourself without explaining or apologising. Do something that fills you up and is not a task. Count one act of giving each time you make someone's day easier.", "consistency": "In experiments, people who wrote down what they were grateful for were more optimistic and more satisfied with life. Another study found that spending a small amount on others made people happier than spending it on themselves."}, "ar": {"improve": "الشكر يعمل أفضل عندما يكون محددًا: ثلاثة أشياء حقيقية من اليوم وليس قائمة تتكرر. والعطاء قد يكون صغيرًا: رسالة أو ابتسامة أو خدمة. ضع وقت {p2} لنفسها في الجدول أولًا حتى لا يعتمد على ما يتبقى.", "guidance": "احمِ الوقت الذي تخصصه لنفسك بدون تبرير أو اعتذار. افعل شيئًا يملؤك ولا يكون مهمة. واحسب عطاءً في كل مرة تسهّل فيها يوم أحد.", "consistency": "في التجارب، من كتبوا ما يشكرون عليه كانوا أكثر تفاؤلًا ورضًا عن حياتهم. ودراسة أخرى وجدت أن إنفاق مبلغ صغير على الآخرين أسعد الناس أكثر من إنفاقه على أنفسهم."}, "sources": ["Emmons and McCullough, Journal of Personality and Social Psychology, 2003", "Dunn, Aknin and Norton, Science, 2008", "Sunan at-Tirmidhi 1956 on a smile as charity"]}}, "tips": {"quran": [{"en": "Pin your two pages to a moment you never skip, such as right after Fajr. The old habit carries the new one.", "ar": "اربط صفحتيك بلحظة لا تفوّتها أبدًا، مثل بعد الفجر مباشرة. العادة القديمة تحمل الجديدة.", "book": "Atomic Habits"}, {"en": "Leave the mushaf open where you will sit tonight. Make the good habit the easy one.", "ar": "اترك المصحف مفتوحًا في المكان الذي ستجلس فيه الليلة. اجعل العادة الجيدة هي الأسهل.", "book": "Atomic Habits"}, {"en": "If a day goes wrong, read just one page. Not zero is the rule, and the streak of showing up matters most.", "ar": "لو اليوم ضاع، اقرأ صفحة واحدة. القاعدة: ليس صفرًا، والمهم سلسلة الحضور.", "book": "Tiny Habits"}], "tafsir": [{"en": "Read the tafsir of the same ayat you recited and write one line you can act on today.", "ar": "اقرأ تفسير نفس الآيات التي تلوتها واكتب سطرًا واحدًا يمكنك العمل به اليوم.", "book": ""}, {"en": "Do tafsir right after Maghrib with tea. A pleasant ritual makes the habit attractive.", "ar": "اجعل التفسير بعد المغرب مع الشاي. الطقس اللطيف يجعل العادة جذابة.", "book": "Atomic Habits"}], "practice": [{"en": "Choose a trigger you never miss, like leaving the mosque or brushing your teeth, and say your azkar right then.", "ar": "اختر محفزًا لا يفوتك، مثل الخروج من المسجد أو غسل الأسنان، وقل أذكارك في تلك اللحظة.", "book": "Atomic Habits"}, {"en": "Keep a small azkar card or app where your eyes land in the morning. What you see, you do.", "ar": "ضع بطاقة أذكار صغيرة أو تطبيقًا حيث تقع عينك صباحًا. ما تراه تفعله.", "book": "Atomic Habits"}], "qiyam": [{"en": "Decide the three nights now, for example Sunday, Tuesday and Thursday, and prepare your clothes and prayer mat before sleep.", "ar": "حدّد الليالي الثلاث الآن، مثلًا الأحد والثلاثاء والخميس، وجهّز ملابسك وسجادتك قبل النوم.", "book": "The Power of Habit"}, {"en": "Two rak‘ahs count. A short night prayer you keep is better than a long one you skip.", "ar": "ركعتان تُحسبان. قيام قصير تحافظ عليه أفضل من طويل تتركه.", "book": "Atomic Habits"}], "fast": [{"en": "Put the Monday and Thursday fasts in the calendar at the start of the month and pick the two you will keep.", "ar": "ضع صيام الاثنين والخميس في التقويم أول الشهر واختر اليومين اللذين ستلتزم بهما.", "book": "The 7 Habits of Highly Effective People"}, {"en": "Plan the suhoor the night before so the decision is already made.", "ar": "جهّز السحور من الليلة السابقة ليكون القرار متخذًا مسبقًا.", "book": "Atomic Habits"}], "exercise": [{"en": "Look at which days the workout slips and put it at the same hour on those days. Same time, same place, no debate.", "ar": "انظر في أي الأيام يفوتك التمرين وضعه في نفس الساعة في تلك الأيام. نفس الوقت ونفس المكان دون نقاش.", "book": "Atomic Habits"}, {"en": "On a tired day do ten minutes. Showing up keeps the identity of someone who trains.", "ar": "في اليوم المتعب اعمل عشر دقائق. الحضور يحافظ على هوية من يتمرن.", "book": "Tiny Habits"}, {"en": "Lay out your workout clothes the night before. The easiest start wins.", "ar": "جهّز ملابس التمرين من الليلة السابقة. أسهل بداية هي الفائزة.", "book": "Atomic Habits"}], "water": [{"en": "Keep a bottle where you work and fill it twice. Spread six glasses across the day instead of catching up at night.", "ar": "ضع زجاجة حيث تعمل واملأها مرتين. وزّع الأكواب الستة على اليوم بدل التعويض في الليل.", "book": "Atomic Habits"}, {"en": "Drink one glass right after each prayer. The prayer is the cue.", "ar": "اشرب كوبًا بعد كل صلاة. الصلاة هي الإشارة.", "book": "Atomic Habits (habit stacking)"}], "weigh": [{"en": "Weigh in on the same morning each week, same conditions, and look at the trend line, not a single reading.", "ar": "قِس وزنك في نفس الصباح كل أسبوع وبنفس الظروف، وانظر إلى الاتجاه وليس قراءة واحدة.", "book": "Self-monitoring research"}], "steps": [{"en": "Walk ten minutes after the biggest meal. It is easy to remember and the steps add up.", "ar": "امشِ عشر دقائق بعد أكبر وجبة. من السهل تذكرها والخطوات تتراكم.", "book": "Atomic Habits"}], "learn": [{"en": "Protect twenty minutes at a fixed hour and choose the material in advance so you never spend the time deciding.", "ar": "احمِ عشرين دقيقة في ساعة ثابتة واختر المادة مسبقًا حتى لا تضيع الوقت في القرار.", "book": "Deep Work"}, {"en": "After each session write one line about what you will apply. Learning that is used sticks.", "ar": "بعد كل جلسة اكتب سطرًا عما ستطبّقه. التعلّم الذي يُستخدم يثبت.", "book": "Make It Stick"}], "podcast": [{"en": "Listen on a commute or while washing up, and pick one episode tied to something you are working on.", "ar": "استمع في المواصلات أو أثناء غسل الأطباق، واختر حلقة مرتبطة بشيء تعمل عليه.", "book": "Atomic Habits (temptation bundling)"}], "couple": [{"en": "Put the two couple slots in the calendar on Sunday, like appointments, and protect them. Phones away, one question that is not about logistics.", "ar": "ضعا موعدي الوقت الجميل في التقويم يوم الأحد مثل المواعيد المهمة واحمياهما. هواتف بعيدة وسؤال واحد ليس عن الترتيبات.", "book": "The Seven Principles for Making Marriage Work"}, {"en": "Notice the small invitations: “look at this”, a sigh, a joke. Turning toward them is where closeness is built.", "ar": "انتبها للدعوات الصغيرة: «انظر إلى هذا» أو تنهيدة أو نكتة. الاستجابة لها هي مكان بناء القرب.", "book": "The Seven Principles for Making Marriage Work"}], "kids": [{"en": "Pick one fixed ten-minute moment, like after dinner, where the children get your full attention, phone away.", "ar": "اختر لحظة ثابتة مدتها عشر دقائق، مثل بعد العشاء، يحصل فيها الأولاد على كامل انتباهك والهاتف بعيدًا.", "book": "Atomic Habits"}], "story": [{"en": "Make the bedtime story the last thing before lights out. The routine itself calms the evening.", "ar": "اجعل قصة ما قبل النوم آخر شيء قبل إطفاء الأنوار. الروتين نفسه يهدّئ المساء.", "book": "The Power of Habit"}], "appreciate": [{"en": "Say one specific thing at the same moment each day, like when you sit for dinner. “Thank you for handling the school call” beats “thanks for everything”.", "ar": "قل شيئًا محددًا في نفس اللحظة كل يوم، مثل وقت العشاء. «شكرًا لأنك تعاملت مع مكالمة المدرسة» أفضل من «شكرًا على كل شيء».", "book": "The Five Love Languages"}], "spend": [{"en": "Log the day’s total every day, even on bad days. A number you can see changes what you do tomorrow.", "ar": "سجّل إجمالي اليوم كل يوم حتى في الأيام السيئة. الرقم الذي تراه يغيّر ما تفعله غدًا.", "book": "Self-monitoring research"}, {"en": "Decide the day’s limit in the morning and check the total at lunch. A mid-day look is easier than a night regret.", "ar": "حدّد حد اليوم صباحًا وراجع الإجمالي وقت الغداء. نظرة منتصف النهار أسهل من ندم الليل.", "book": "Self-monitoring research"}], "delivery": [{"en": "On Sunday choose the three delivery nights and plan the other dinners. A plan beats willpower at 9 pm.", "ar": "يوم الأحد اختر ليالي التوصيل الثلاث وخطط للعشاءات الأخرى. الخطة أقوى من الإرادة الساعة 9 مساءً.", "book": "Atomic Habits"}, {"en": "Keep two fast meals in the freezer. The easy home option defeats the easy phone option.", "ar": "احتفظ بوجبتين سريعتين في الفريزر. الخيار المنزلي السهل يهزم خيار الهاتف السهل.", "book": "Atomic Habits"}], "jobhunt": [{"en": "Put the 60 minutes at a fixed hour and end it by sending something out: an application, a message, a pitch. Measure what left your hands, not the hours.", "ar": "ضع الستين دقيقة في ساعة ثابتة وأنهِها بإرسال شيء: طلب أو رسالة أو عرض. قِس ما خرج من يدك لا الساعات.", "book": "Deep Work"}, {"en": "Keep a simple list of three kinds of actions: apply, reach out, learn. Rotate them so the hour never feels stuck.", "ar": "احتفظ بقائمة بسيطة من ثلاثة أنواع من الأفعال: تقديم وتواصل وتعلّم. بدّل بينها كي لا تشعر أن الساعة عالقة.", "book": "Essentialism"}], "bizfocus": [{"en": "Decide the single outcome of the 45 minutes before you start: one page, one call, one sample. Research alone feels like progress but is not.", "ar": "حدّد النتيجة الوحيدة للخمس والأربعين دقيقة قبل أن تبدأ: صفحة أو مكالمة أو نموذج. البحث وحده يشبه التقدّم لكنه ليس تقدّمًا.", "book": "The Lean Startup"}, {"en": "Close the tabs, put the phone in another room, and work in one block. Depth beats hours.", "ar": "أغلقي التبويبات وضعي الهاتف في غرفة أخرى واعملي في فترة واحدة. العمق أهم من الساعات.", "book": "Deep Work"}], "bizoutput": [{"en": "End the week with one finished thing you can show to a real person, even if small. Then log it here.", "ar": "اختمي الأسبوع بشيء مكتمل يمكنك أن تُريه لشخص حقيقي حتى لو كان صغيرًا. ثم سجّليه هنا.", "book": "The Lean Startup"}, {"en": "Talk to one possible customer this week and ask about their life, not your idea.", "ar": "تحدّثي مع زبون محتمل واحد هذا الأسبوع واسأليه عن حياته لا عن فكرتك.", "book": "The Mom Test"}], "bizcheck": [{"en": "Keep the 15 minutes short and fixed: what we did, what is next, one thing blocking us.", "ar": "اجعلا الخمس عشرة دقيقة قصيرة وثابتة: ماذا فعلنا وما التالي وما العائق الوحيد.", "book": "Essentialism"}], "metime": [{"en": "Put your time for yourself in the calendar before everything else so it does not depend on what is left.", "ar": "ضعي وقتك لنفسك في التقويم قبل أي شيء حتى لا يعتمد على ما يتبقى.", "book": "Essentialism"}, {"en": "Do something that fills you up and is not a task. You do not need to explain it.", "ar": "افعلي شيئًا يملأك وليس مهمة. لا تحتاجين لتبريره.", "book": "Four Thousand Weeks"}], "gratitude": [{"en": "Name three specific things from today, not the same list as yesterday. Specific is what changes the feeling.", "ar": "اذكر ثلاثة أشياء محددة من اليوم لا نفس قائمة الأمس. المحدد هو ما يغيّر الشعور.", "book": "Emmons and McCullough, 2003"}, {"en": "Do it at the same time each night, for example before you put the phone down to sleep.", "ar": "افعلها في نفس الوقت كل ليلة، مثلًا قبل أن تضع الهاتف للنوم.", "book": "Atomic Habits"}], "give": [{"en": "Giving can be tiny: a message, a smile, a favour. Keep one in your pocket for the day.", "ar": "العطاء يمكن أن يكون صغيرًا: رسالة أو ابتسامة أو خدمة. احتفظ بواحد في جيبك لليوم.", "book": "Prophetic teaching on a smile as charity"}, {"en": "Schedule one act of giving for the start of the day. Done early, it colours the rest.", "ar": "حدّد فعل عطاء واحد في بداية اليوم. إذا تم مبكرًا، لوّن بقية اليوم.", "book": "Atomic Habits"}], "general": [{"en": "Attach it to something you already do each day. Habits grow best when they ride on another habit.", "ar": "اربطها بشيء تفعله أصلًا كل يوم. العادات تنمو أفضل حين تركب على عادة أخرى.", "book": "Atomic Habits"}, {"en": "Shrink it until it takes two minutes on a tired day. Not zero is the rule.", "ar": "صغّرها حتى تأخذ دقيقتين في اليوم المتعب. القاعدة: ليس صفرًا.", "book": "Atomic Habits"}, {"en": "Make it visible: a note, an object, a place. What is in front of you gets done.", "ar": "اجعلها مرئية: ملاحظة أو غرض أو مكان. ما أمامك يُنجز.", "book": "Atomic Habits"}]}, "trophies": [{"id": "k_checkins", "icon": "check", "en": "Check-in champion", "ar": "بطل التسجيل", "dEn": "Habits you ticked since you started. Next level: {n}.", "dAr": "العادات التي سجّلتها منذ البداية. المستوى التالي: {n}.", "rule": {"t": "checkins"}, "tiers": [1, 25, 100, 250, 500, 1000]}, {"id": "k_fulldays", "icon": "sun", "en": "Full days", "ar": "أيام كاملة", "dEn": "Days with every daily habit done. Next level: {n} days.", "dAr": "أيام أنجزت فيها كل العادات اليومية. المستوى التالي: {n} يومًا.", "rule": {"t": "fulldays"}, "tiers": [1, 5, 15, 30, 60, 100]}, {"id": "k_streak", "icon": "flame", "en": "Streak", "ar": "السلسلة", "dEn": "Best run of days in a row at 60% or more. Next level: {n} days.", "dAr": "أفضل سلسلة أيام متتالية بنسبة 60% أو أكثر. المستوى التالي: {n} يومًا.", "rule": {"t": "streak"}, "tiers": [3, 7, 14, 30, 66, 100]}, {"id": "k_quran", "icon": "book", "en": "Qur’an pages", "ar": "صفحات القرآن", "dEn": "Pages recited since you started (604 = one khatma). Next level: {n} pages.", "dAr": "الصفحات التي تلوتها منذ البداية (604 = ختمة). المستوى التالي: {n} صفحة.", "rule": {"t": "pages", "k": "quran"}, "tiers": [10, 100, 302, 604, 1208, 1812]}, {"id": "k_tafsir", "icon": "book", "en": "Tafsir pages", "ar": "صفحات التفسير", "dEn": "Tafsir pages read. Next level: {n} pages.", "dAr": "صفحات التفسير المقروءة. المستوى التالي: {n} صفحة.", "rule": {"t": "pages", "k": "tafsir"}, "tiers": [10, 100, 302, 604]}, {"id": "k_azkar", "icon": "sun", "en": "Morning azkar", "ar": "أذكار الصباح", "dEn": "Mornings you said your azkar. Next level: {n} days.", "dAr": "صباحات قلت فيها أذكارك. المستوى التالي: {n} يومًا.", "rule": {"t": "days", "h": const NAME_AR={Muhammed:'محمد',Muhammad:'محمد',Mohamed:'محمد',Tota:'توتا',Tuta:'توتا'};
const AR_EXACT={};
const AR_RULES=(function(){
  const rules=AR_PAIRS.filter(function(p){return p[0].length>1}).map(function(p){
    const e=p[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/#/g,'(\\d[\\d,\\.]*)');
    const lead=/^[A-Za-z]/.test(p[0])?'\\b':'',tail=/[A-Za-z]$/.test(p[0])?'\\b':'';
    let k=0;const ar=p[1].split('#').map(function(x,i){return i?'$'+(++k)+x:x}).join('');
    return {len:p[0].length,re:new RegExp(lead+e+tail,'g'),ar:ar};
  });
  rules.sort(function(a,b){return b.len-a.len});
  return rules;
})();
function trs(s){
  if(!s||!/[A-Za-z]/.test(s))return s;
  const tt=s.trim();if(AR_EXACT[tt])return s.replace(tt,AR_EXACT[tt]);
  let o=s;
  for(let i=0;i<AR_RULES.length;i++){const r=AR_RULES[i];if(r.re.test(o)){r.re.lastIndex=0;o=o.replace(r.re,r.ar)}r.re.lastIndex=0}
  return o;
}
const hasLatin=s=>/[A-Za-z]/.test(s);
function trHtml(h){return String(h).split(/(<[^>]+>)/).map(function(p){return p.charAt(0)==='<'?p:trs(p)}).join('')}
const EN_TXT=new WeakMap();
function trDom(){
  const ar=ui.lang==='ar';
  document.documentElement.lang=ar?'ar':'en';
  document.documentElement.dir=ar?'rtl':'ltr';
  const skip=/^(SCRIPT|STYLE|TEXTAREA|INPUT)$/;
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    const p=n.parentNode;if(!p||skip.test(p.nodeName))return NodeFilter.FILTER_REJECT;
    if(p.closest&&p.closest('[data-notr]'))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT}});
  const nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
  nodes.forEach(function(t){
    let rec=EN_TXT.get(t);
    if(!rec){rec={en:t.nodeValue,last:t.nodeValue};EN_TXT.set(t,rec)}
    else if(t.nodeValue!==rec.last)rec.en=t.nodeValue;
    const v=ar?trs(rec.en):rec.en;
    if(v!==t.nodeValue)t.nodeValue=v;
    rec.last=t.nodeValue;
  });
  document.querySelectorAll('[aria-label],[title],[placeholder],[data-tip]').forEach(function(e){
    ['aria-label','title','placeholder'].forEach(function(a){
      const v=e.getAttribute(a);if(v==null)return;
      const k='data-en-'+a;
      if(!e.hasAttribute(k))e.setAttribute(k,v);
      const en=e.getAttribute(k);
      const nv=ar?trs(en):en;if(nv!==v)e.setAttribute(a,nv);
    });
    const d=e.getAttribute('data-tip');
    if(d!=null){
      if(!e.hasAttribute('data-en-tip'))e.setAttribute('data-en-tip',d);
      const en=e.getAttribute('data-en-tip');const nv=ar?trHtml(en):en;if(nv!==d)e.setAttribute('data-tip',nv);
    }
  });
}

function achApplies(pid,r){
  const has=f=>S.habits.some(h=>f(h)&&h.who.indexOf(pid)>=0);

function achProgress(pid,r){
  const s=pd(S.start),t=today();
  switch(r.t){
    case 'checkins':return checkIns(pid,s,t);
    case 'fulldays':return fullDays(pid,s,t);
    case 'streak':return streaks(pid).best;
    case 'pages':{const o=impact(pid,s,t);return r.k==='tafsir'?o.tafsirPages:o.pages}
    case 'minutes':{const o=impact(pid,s,t);return r.k==='study'?o.studyMin:o.exMin}
    case 'days':{let n=0;const log=L[pid]||{};Object.keys(log).forEach(k=>{if(log[k].indexOf(r.h)>=0)n++});return n}
    case 'tagall':{let n=0;const v=V[pid]||{};Object.keys(v).forEach(k=>{S.habits.forEach(h=>{if(h.type==='tag'){const x=v[k][h.id];if(x&&x.t)n++}})});return n}
    case 'tag':{let n=0;const v=V[pid]||{};Object.keys(v).forEach(k=>{S.habits.forEach(h=>{if(h.type==='tag'){const x=v[k][h.id];if(x&&x.t===r.v)n++}})});return n}
    case 'underspend':{
      const h=S.habits.find(x=>x.kind==='spend'&&x.type==='num');if(!h)return 0;
      let best=0,run=0;for(let d=s;d<=t;d=addDays(d,1)){const v=getVal(repOf(h,pid),ds(d),h.id);if(v!=null&&Number(v)<=h.goal){run++;if(run>best)best=run}else run=0}
      return best;
    }
    case 'cap_weeks':{
      const h=S.habits.find(x=>x.type==='cap');if(!h)return 0;
      let n=0;
      for(let a=wkStart(s);addDays(a,6)<t;a=addDays(a,7)){

        for(let d=a;d<=addDays(a,6);d=addDays(d,1)){if(d>=s&&(((L[pid]||{})[ds(d)])||[]).length)active=true}
        if(active&&capSum(pid,h,a,addDays(a,6))<=h.goal)n++;

}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeSample(){
  const cfg=defaults();cfg.setup=true;
  const t=today();const k=(t.getDay()-cfg.weekStart+7)%7;const start=addDays(addDays(t,-k),-70);
  cfg.start=ds(start);
  cfg.people[0].height=175;cfg.people[0].weight=78;cfg.people[0].year=1988;
  cfg.people[1].height=163;cfg.people[1].weight=64;cfg.people[1].year=1990;
  const logs={p1:{},p2:{}},vals={p1:{},p2:{}};const R=rng(11);
  const q={p1:[.62,.9],p2:[.42,.86]};
  const diff={workout:-.07,couple:-.05,learn:-.04,tafsir:-.03,quran:.04,bizfocus:-.05,give:-.06};
  const w0={p1:78,p2:64};
  let n=0;for(let d=start;d<=t;d=addDays(d,1))n++;
  const noteList=['One-page plan','Supplier quote','Price test','Sample ready','Call with a shop owner'];
  const tagSeq=['idea','idea','talk','talk','sample','talk','sample','sale'];
  ['p1','p2'].forEach(pid=>{
    let i=0,tagI=0;
    for(let d=start;d<=t;d=addDays(d,1),i++){
      const dst=ds(d);
      const fr=n>1?i/(n-1):1;const base=q[pid][0]+(q[pid][1]-q[pid][0])*fr;const arr=[];
      cfg.habits.forEach(h=>{
        if(h.who.indexOf(pid)<0)return;
        if(h.joint&&pid!==h.who[0])return;
        const setV=v=>{(vals[pid][dst]||(vals[pid][dst]={}))[h.id]=v};
        if(h.type==='cap'){
          if(R()<.28&&!sameDay(d,t))setV(1+(R()<.2?1:0));
          return;
        }
        const perDay=h.per==='month'?h.target/30.4:h.target/7;
        let pr=clamp((base+(diff[h.id]||0))*perDay*(h.per==='month'?1:1)+0.04*(h.per==='month'?0:1),0,.97);
        if(sameDay(d,t))pr*=.5;
        const hit=R()<pr;
        if(h.type==='count'){
          const g=h.goal||1;
          if(hit){arr.push(h.id);setV(g)}
          else if(R()<.5&&!sameDay(d,t))setV(Math.floor(R()*g));
          return;
        }
        if(!hit)return;
        arr.push(h.id);
        if(h.type==='num'){
          if(h.kind==='spend')setV(Math.round(850+R()*(h.goal*0.75)));
          else if(h.kind==='weight')setV(Math.round((w0[pid]-i*(pid==='p1'?0.045:0.03)+(R()-.5)*.6)*10)/10);
          else setV(Math.round(4000+R()*6000));
        }else if(h.type==='tag'){
          setV({t:tagSeq[Math.min(tagI,tagSeq.length-1)],n:noteList[tagI%noteList.length]});tagI++;
        }
      });
      if(arr.length)logs[pid][dst]=arr;
    }
  });
  /* shared habits: the same record for both people */
  cfg.habits.filter(h=>h.joint).forEach(h=>{
    const src=h.who[0];
    h.who.forEach(pid=>{
      if(pid===src)return;
      Object.keys(logs[src]).forEach(dst=>{
        const has=logs[src][dst].indexOf(h.id)>=0;
        if(has)(logs[pid][dst]||(logs[pid][dst]=[])).push(h.id);
      });
      Object.keys(vals[src]).forEach(dst=>{
        if(vals[src][dst][h.id]!==undefined)(vals[pid][dst]||(vals[pid][dst]={}))[h.id]=vals[src][dst][h.id];
      });
    });
  });
  return {cfg:cfg,logs:logs,vals:vals};
}

/* ---------- scoring ---------- */
function daysIn(from,to){
  const s=pd(S.start),t=today();const a=from<s?s:from;const b=to>t?t:to;const out=[];
  for(let d=a;d<=b;d=addDays(d,1))out.push(d);return out;
}
function stats(pid,from,to,areaFilter){
  const days=daysIn(from,to),nd=days.length,log=L[pid]||{};
  let exp=0,cred=0;const byHabit={},byArea={};
  habitsFor(pid).forEach(h=>{
    if(areaFilter&&h.area!==areaFilter)return;
    let done=0;days.forEach(d=>{if((log[ds(d)]||[]).indexOf(h.id)>=0)done++});
    const e=(h.per==='month'?h.target*nd/30.4:h.target*nd/7),c=Math.min(done,e);
    byHabit[h.id]={done:done,exp:e,cred:c};exp+=e;cred+=c;
    const a=byArea[h.area]||(byArea[h.area]={exp:0,cred:0});a.exp+=e;a.cred+=c;
  });
  return {nd:nd,exp:exp,cred:cred,pct:exp>0?cred/exp:null,byHabit:byHabit,byArea:byArea};
}
function statsMulti(pids,from,to){
  let exp=0,cred=0,nd=0;
  pids.forEach(p=>{const s=stats(p,from,to);exp+=s.exp;cred+=s.cred;nd=Math.max(nd,s.nd)});
  return {exp:exp,cred:cred,nd:nd,pct:exp>0?cred/exp:null};
}
function dayPct(pid,d){
  let hs=habitsFor(pid);if(!hs.length)return null;
  const dl=hs.filter(isDaily);if(dl.length)hs=dl;
  const a=(L[pid]||{})[ds(d)]||[];let n=0;hs.forEach(h=>{if(a.indexOf(h.id)>=0)n++});return n/hs.length;
}
function streaks(pid){
  const t=today(),s=pd(S.start),arr=[];
  for(let d=s;d<=t;d=addDays(d,1)){const v=dayPct(pid,d);arr.push(v!=null&&v>=0.6)}
  const runEnd=a=>{let n=0;for(let i=a.length-1;i>=0&&a[i];i--)n++;return n};
  let best=0,run=0;arr.forEach(v=>{run=v?run+1:0;if(run>best)best=run});
  const cur=arr.length&&arr[arr.length-1]?runEnd(arr):runEnd(arr.slice(0,-1));
  return {cur:cur,best:best};
}
function fullDays(pid,from,to){let n=0;daysIn(from,to).forEach(d=>{if(dayPct(pid,d)===1)n++});return n}
function checkIns(pid,from,to){
  let n=0;const log=L[pid]||{};const ids=habitsFor(pid).map(h=>h.id);
  daysIn(from,to).forEach(d=>{(log[ds(d)]||[]).forEach(x=>{if(ids.indexOf(x)>=0)n++})});return n;
}
function weekSeries(pids,n){const o=[];for(let i=n-1;i>=0;i--){const r=P.wk(-i);const s=statsMulti(pids,r[0],r[1]);o.push({a:r[0],pct:s.pct})}return o}
function monthSeries(pids,n){const o=[];for(let i=n-1;i>=0;i--){const r=P.mo(-i);const s=statsMulti(pids,r[0],r[1]);o.push({a:r[0],pct:s.pct})}return o}
function zone(p){if(p==null)return 'No data yet';if(p<.5)return 'Building momentum';if(p<.8)return 'Steady';return 'Thriving'}
function improvement(pids){
  const s=pd(S.start),t=today();let n=0;for(let d=s;d<=t;d=addDays(d,1))n++;
  if(n<56)return null;
  const a=statsMulti(pids,s,addDays(s,27)),b=statsMulti(pids,addDays(t,-27),t);
  return (a.pct==null||b.pct==null)?null:{from:a.pct,to:b.pct};
}
function impact(pid,from,to,area){
  const days=daysIn(from,to),nd=days.length,log=L[pid]||{};
  const o={nd:nd,exMin:0,pages:0,tafsirPages:0,studyMin:0,readPages:0,connMin:0,connDays:0,saved:0,practice:0,checks:0,
    glasses:0,waterDays:0,spendTotal:0,spendDays:0,spendUnder:0,spendLimit:0,wFirst:null,wLast:null,wN:0,steps:0,
    jobMin:0,jobDays:0,bizMin:0,bizDays:0,orders:0,capGoal:0,outputs:0,tags:{}};
  ALLH(pid).forEach(h=>{
    if(area&&h.area!==area)return;
    const rp=repOf(h,pid);
    if(h.type==='cap'){days.forEach(d=>{o.orders+=Number(getVal(rp,ds(d),h.id))||0});o.capGoal=h.goal;return}
    let done=0;days.forEach(d=>{if((log[ds(d)]||[]).indexOf(h.id)>=0)done++});
    const amt=Number(h.amount)||0;
    switch(h.kind){
      case 'exercise':o.exMin+=done*amt;break;
      case 'quran':o.pages+=done*amt;break;
      case 'tafsir':o.tafsirPages+=done*amt;break;
      case 'study':o.studyMin+=done*amt;break;
      case 'reading':o.readPages+=done*amt;break;
      case 'connection':o.connMin+=done*amt;o.connDays+=done;break;
      case 'savings':o.saved+=done*amt;break;
      case 'practice':o.practice+=done;break;
      case 'jobhunt':o.jobMin+=done*amt;o.jobDays+=done;break;
      case 'bizfocus':o.bizMin+=done*amt;o.bizDays+=done;break;
      case 'water':days.forEach(d=>{const v=Number(getVal(rp,ds(d),h.id))||0;o.glasses+=v;if(h.goal>0&&v>=h.goal)o.waterDays++});break;
      case 'spend':o.spendLimit=h.goal;days.forEach(d=>{const v=getVal(rp,ds(d),h.id);if(v!=null&&typeof v!=='object'){o.spendTotal+=Number(v);o.spendDays++;if(Number(v)<=h.goal)o.spendUnder++}});break;
      case 'weight':days.forEach(d=>{const v=getVal(rp,ds(d),h.id);if(v!=null&&typeof v!=='object'){if(o.wFirst==null)o.wFirst=Number(v);o.wLast=Number(v);o.wN++}});break;
      case 'steps':days.forEach(d=>{o.steps+=Number(getVal(rp,ds(d),h.id))||0});break;
      default:o.checks+=done;
    }
    if(h.type==='tag'){o.outputs+=done;days.forEach(d=>{const v=getVal(rp,ds(d),h.id);if(v&&typeof v==='object'&&v.t)o.tags[v.t]=(o.tags[v.t]||0)+1})}
  });
  const weeks=nd/7;
  o.exWeek=weeks>0?o.exMin/weeks:0;
  o.connWeek=weeks>0?o.connMin/60/weeks:0;
  o.ordersWeek=weeks>0?o.orders/weeks:0;
  return o;
}
function kindsIn(pids,area){

}

const MIRROR='istiqama.v1';
const pending={},timers={},busy={};
function mirror(){try{localStorage.setItem(MIRROR,JSON.stringify({S:S,L:L,V:V}))}catch(e){}}
function loadMirror(){try{const r=localStorage.getItem(MIRROR);if(!r)return null;const j=JSON.parse(r);return j&&j.S&&j.S.setup?j:null}catch(e){return null}}
function setSync(v){sync=v;renderStatus()}
function queue(id,data){
  if(!DB)return;pending[id]=data;clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),350);
}
async function flush(id){
  timers[id]=0;
  if(busy[id]){timers[id]=setTimeout(()=>flush(id),300);return}
  const data=pending[id];if(!data)return;delete pending[id];busy[id]=true;
  try{await DB.doc('habit/'+id).set(data);lastWrite=Date.now();setSync('synced')}
  catch(e){
    setSync('local');
    if(!pending[id])pending[id]=data;clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),8000);
    if(!flush.warned){flush.warned=true;toast("No internet right now. Your ticks are kept on this phone and will upload when it is back.")}
  }
  finally{busy[id]=false;if(pending[id]&&!timers[id])timers[id]=setTimeout(()=>flush(id),50)}
}
function saveConfig(){mirror();queue('config',{cfg:S})}
function saveLog(pid){mirror();queue('log-'+pid,{days:L[pid]||{}})}
function saveVal(pid){mirror();queue('val-'+pid,{vals:V[pid]||{}})}
function applyRemote(docs){
  let c=docs.config&&docs.config.cfg;
  if(!c||!c.setup)return 0;
  c.people.forEach(p=>{p.focus=p.focus||[];p.g=p.g||(p.id==='p2'?'f':'m')});
  c.habits=(c.habits||[]).map(h=>Object.assign({type:'tick',per:'week',goal:0,joint:false,ar:''},h,{who:h.who&&h.who.length?h.who:['p1','p2']}));
  let migrated=false;
  if(!(c.v>=2)){c=migrate(c);migrated=true}
  const nl={},nv={};
  c.people.forEach(p=>{
    const id='log-'+p.id,vid='val-'+p.id;
    nl[p.id]=(pending[id]||busy[id])?(L[p.id]||{}):((docs[id]&&docs[id].days)||{});
    nv[p.id]=(pending[vid]||busy[vid])?(V[p.id]||{}):((docs[vid]&&docs[vid].vals)||{});
  });
  const changed=JSON.stringify(S)!==JSON.stringify(c)||JSON.stringify(L)!==JSON.stringify(nl)||JSON.stringify(V)!==JSON.stringify(nv)||mode!=='db';
  S=c;L=nl;V=nv;mode='db';mirror();
  if(migrated)saveConfig();
  return changed?2:1;
}
let firstSnap=true;
function onDocs(snap){
  if(snap.metadata&&snap.metadata.hasPendingWrites)return;
  const docs={};snap.docs.forEach(d=>{docs[d.id]=d.data()});
  if(firstSnap){
    firstSnap=false;
    if(docs.config&&docs.config.cfg&&docs.config.cfg.setup){
      applyRemote(docs);setSync('synced');
    }else if(S.setup&&mode==='local'){
      mode='db';setSync('synced');saveConfig();S.people.forEach(p=>{saveLog(p.id);saveVal(p.id)});
    }
    softRender();return;
  }
  const r=applyRemote(docs);
  if(r){setSync('synced');if(r===2)softRender()}
}
